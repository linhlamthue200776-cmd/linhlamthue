 duy trì tác động lên điên môi khí.", "C": "Trong chất khí xuất hiện các điện tích được tạo ra bởi sự ion hóa do va chạm của các \n\nphân tử khí chuyển động.", "D": "Trong chất khí xuất hiện sự ion hóa do va chạm gây bởi điện trường mạnh tác động \n\nlên điên môi khí."}, "ans": "D"}, {"id": 155, "num": 156, "q": "Điện dẫn của một chất điện môi hoàn hảo là:", "opts": {"A": "= 0.", "B": "Vô hạn.", "C": "< 0.", "D": "= 1."}, "ans": "A"}, {"id": 156, "num": 157, "q": "Phát biểu nào dưới đây về tính dẫn điện của điện môi khí, lỏng là không đúng?", "opts": {"A": "Điện dẫn của điện môi khí được xác định theo Ipc.", "B": "Điện dẫn của điện môi khí được gây bởi sự ion hoá bên ngoài gọi là điện dẫn không \ntự duy trì. Nguồn gây nên ion hoá chất khí là tia Rơnghen, tia cực tím, sự phóng xạ và \ncả tác dụng nhiệt…", "C": "Điện dẫn của điện môi khí gây bởi ion hoá do va chạm giữa các hạt mang điện chuyển \n\nđộng trong điện trường với động năng đủ lớn với các phân tử khí được gọi là điện dẫn \ntự duy trì.", "D": "Điện dẫn của điện môi lỏng liên quan chặt chẽ với cấu tạo phân tử của chất lỏng."}, "ans": "A"}, {"id": 157, "num": 158, "q": "Phát biểu nào dưới đây về tính dẫn điện của điện môi là không đúng?", "opts": {"A": "Dòng điện dò luôn luôn tồn tại trong mọi loại điện môi và không phụ thuộc vào \ndạng điện áp.", "B": "Khi đặt điện áp xoay chiều vào điện môi, dòng điện phân cực luôn luôn tồn tại \n\ntrong điện môi.", "C": "Ở điện áp xoay chiều điện dẫn của điện môi được xác định theo Irò.", "D": "Để so sánh, đánh giá mức độ dẫn điện các vật liệu khác nhau có thể dùng điện trở \n\nsuất khối v và điện trở suất mặt s."}, "ans": "C"}, {"id": 158, "num": 159, "q": "Anh (chị) hãy chỉ ra dạng đúng đặc tính Von-Ampe của điện môi LỎNG? \n\ni \n\ni \n\ni \n\ni \n\n(1)\n\nA \n\nB \n\n(2)\n\nU \n\nU \n\nU\n\nUtdt \n\nU\nHình 2 \n\nU \n\nHình 3 \n\nU \n\nUth \nHình 4 \n\nHình 1", "opts": {"A": "Hình 1.", "B": "Hình 2.", "C": "Hình 3.", "D": "Hình 4."}, "ans": "D"}, {"id": 159, "num": 160, "q": "Phát biểu nào dưới đây về tính dẫn điện của điện môi lỏng là không đúng?", "opts": {"A": "Quá trình làm sạch điện môi (làm giảm điện dẫn của điện môi lỏng) xảy ra khi đóng \n\nmạch vào nguồn 1 chiều.", "B": "Quá trình làm sạch điện môi (làm giảm điện dẫn của điện môi lỏng) xảy ra khi đóng \n\nmạch vào nguồn xoay chiều.", "C": "Điện dẫn của điện môi lỏng bao gồm điện dẫn của điện môi chính và điện dẫn của \ntạp chất.", "D": "Khử tạp chất trong điện môi lỏng sẽ làm giảm điện dẫn của nó."}, "ans": "B"}, {"id": 160, "num": 161, "q": "Phát biểu nào dưới đây về tính dẫn điện của điện môi rắn là không đúng?", "opts": {"A": "Các chất hữu cơ cao phân tử có điện dẫn suất phụ thuộc mạnh vào các yếu tố: thành \nphần hoá học, các tạp chất, mức độ trùng hợp, mức độ lưu hoá.", "B": "Điện dẫn suất của các điện môi rắn xốp khi bị hút ẩm với 1 lượng không đáng kể \n\ncũng tăng lên rất mạnh.", "C": "Trong các điện môi có mạng lưới nguyên tử, phân tử tính dẫn điện chỉ tồn tại khi có \n\ntạp chất.", "D": "Điện dẫn của các điện môi rắn xốp không phụ thuộc độ ẩm."}, "ans": "D"}, {"id": 161, "num": 162, "q": "Phát biểu nào dưới đây về điện dẫn mặt của điện môi rắn là không đúng", "opts": {"A": "Điện dẫn bề mặt của điện môi rắn phụ thuộc nhiều vào lớp bẩn, ẩm bám trên bề mặt \n\nđiện môi.", "B": "Điện dẫn mặt giảm khi bề mặt điện môi càng sạch và nhẵn.", "C": "Dẫn điện của bề mặt tăng thì điện áp đánh thủng giảm.", "D": "Dẫn điện của bề mặt tăng thì điện áp đánh thủng tăng."}, "ans": "D"}, {"id": 162, "num": 163, "q": "Khi nói về điện trở suất mặt, phát biểu nào chưa đúng?", "opts": {"A": "Trị số độ ẩm tương đối của môi trường xung quanh là yếu tố quyết định đối với điện \n\ntrở suất mặt của điện môi.", "B": "Điện trở suất mặt càng cao khi cực tính của vật liệu càng yếu, bề mặt điện môi càng \n\nsạch và nhẵn.", "C": "Muốn nâng cao điện trở suất mặt ta cần làm sạch bề mặt.", "D": "Muốn nâng cao điện dẫn suất mặt ta cần làm sạch bề mặt."}, "ans": "D"}, {"id": 163, "num": 164, "q": "Khi làm việc lâu dài dưới tác dụng của điện áp, dòng điện I qua điện môi rắn, \n\nlỏng có thể tăng hoặc giảm theo thời gian, ta nói: (chọn đáp án sai)", "opts": {"A": "I giảm theo thời gian chứng tỏ độ dẫn điện của vật liệu được giảm đi do sự tẩy sạch \n\nvề điện của khối mẫu.", "B": "I tăng theo thời gian chứng tỏ quá trình hoá già không hồi phục được xảy ra trong \n\nvật liệu.", "C": "I giảm theo thời gian chứng tỏ quá trình hoá già không hồi phục được xảy ra trong \nvật liệu.", "D": "I tăng theo thời gian chứng tỏ trong vật liệu có sự phá huỷ dần dần dẫn đến đánh \nthủng điện môi."}, "ans": "C"}, {"id": 164, "num": 165, "q": "Phân loại vật liệu dẫn điện?", "opts": {"A": "Theo trạng thái: vật liệu dẫn điện có thể là những vật rắn, lỏng, nửa lỏng và trong \nnhững điều kiện nhất định có thể là khí;", "B": "Theo trạng thái: vật liệu dẫn điện có thể là những vật rắn, lỏng và trong những điều \nkiện nhất định có thể là khí;", "C": "Theo trạng thái: vật liệu dẫn điện  có thể là những vật rắn, vật liệu hóa rắn, lỏng, nửa \n\nlỏng và trong những điều kiện nhất định có thể là khí;", "D": "Theo trạng thái: vật liệu dẫn điện có thể là những vật rắn, lỏng và trong những điều \n\nkiện nhất định có thể là khí hóa lỏng;"}, "ans": "B"}, {"id": 165, "num": 165, "q": "Phân loại vật liệu dẫn điện?", "opts": {"A": "Theo điện dẫn của vật dẫn kim loại: vật dẫn có điện dẫn cao và vật dẫn có điện trở \ncao;", "B": "Theo điện dẫn của vật dẫn kim loại: vật dẫn có điện dẫn cao và vật dẫn có điện dẫn \n\ntrung bình và vật dẫn có điện dẫn thấp;", "C": "Theo điện dẫn của vật dẫn kim loại: vật dẫn có điện trở cao và vật dẫn có điện trở \n\nthấp;", "D": "Theo điện dẫn của vật dẫn kim loại: vật dẫn có điện dẫn lớn và vật dẫn có điện dẫn \n\nbé và vật liệu siêu dẫn;"}, "ans": "B"}, {"id": 166, "num": 166, "q": "Phân loại vật liệu dẫn điện?", "opts": {"A": "Theo loại dòng điện tích có: vật dẫn loại 1, vật dẫn loại 2 và vật dẫn loại 3.", "B": "Theo loại dòng điện tích: vật dẫn loại 1 và vật dẫn loại 2.", "C": "Theo loại dòng điện tích: vật dẫn loại 1, vật dẫn loại 2 và vật dẫn loại 3, 4.", "D": "Theo loại dòng điện tích: vật dẫn loại 1, vật dẫn loại 2 và vật liệu siêu dẫn."}, "ans": "B"}, {"id": 167, "num": 167, "q": "Điện trở suất của vật dẫn bị ảnh hưởng nhiều nhất bởi", "opts": {"A": "Tạp chất và nhiệt độ làm việc", "B": "Nhiệt độ và áp suất làm việc", "C": "Các tác động cơ học (kéo, nén)", "D": "Độ lớn của dòng điện"}, "ans": "A"}, {"id": 168, "num": 168, "q": "Điện trở suất của vật dẫn kim loại KHÔNG phụ thuộc vào yếu tố nào sau \n\nđây:", "opts": {"A": "Nồng độ và thành phần tạp chất", "B": "Nhiệt độ làm việc", "C": "Các tác động cơ học (kéo, nén)", "D": "Độ lớn của dòng điện"}, "ans": "D"}, {"id": 169, "num": 169, "q": "Trong nhóm vật liệu dưới đây, ở điều kiện bình thường vật liệu nào có điện \ntrở suất cao nhất?", "opts": {"A": "Đồng", "B": "Vàng", "C": "Bạc", "D": "Ni – Cr"}, "ans": "D"}, {"id": 170, "num": 170, "q": "Trong nhóm vật liệu dưới đây, ở điều kiện bình thường vật liệu nào có điện \ntrở suất cao nhất?", "opts": {"A": "Đồng", "B": "Vàng", "C": "Bạc", "D": "Nhôm"}, "ans": "D"}, {"id": 171, "num": 171, "q": "Trong nhóm vật liệu dưới đây, ở điều kiện bình thường vật liệu nào có điện \n\ntrở suất nhỏ nhất?", "opts": {"A": "Đồng", "B": "Vàng", "C": "Bạc", "D": "Nhôm"}, "ans": "C"}, {"id": 172, "num": 172, "q": "Manganin là hợp kim của:", "opts": {"A": "Mangan và niken", "B": "Đồng và mangan", "C": "Đồng, mangan và niken", "D": "Nhôm, mangan và niken"}, "ans": "C"}, {"id": 173, "num": 173, "q": "Vật liệu nào sau đây có điểm nóng chảy nhỏ nhất?", "opts": {"A": "Đồng.", "B": "Nhôm.", "C": "Niken.", "D": "Thiếc"}, "ans": "D"}, {"id": 174, "num": 174, "q": "Vật liệu nào sau đây có điểm nóng chảy lớn nhất?", "opts": {"A": "Đồng.", "B": "Nhôm.", "C": "Niken.", "D": "Thiếc"}, "ans": "C"}, {"id": 175, "num": 175, "q": "Vật liệu nào sau đây có điểm nóng chảy cao nhất?", "opts": {"A": "Thép", "B": "Đồng thau.", "C": "Coban (Co).", "D": "Bạch kim (Pt)."}, "ans": "D"}, {"id": 176, "num": 176, "q": "Điểm nóng chảy của đồng gần đúng là", "opts": {"A": "13650 C.", "B": "10830 C.", "C": "8650 C.", "D": "6300 C."}, "ans": "B"}, {"id": 177, "num": 177, "q": "Đồng thau là hợp kim của", "opts": {"A": "Đồng và bạc.", "B": "Đồng và vàng.", "C": "Đồng và kẽm.", "D": "Đồng và thiếc."}, "ans": "C"}, {"id": 178, "num": 178, "q": "Đồng (Cu) là kim loại có tính chất nào sau đây?", "opts": {"A": "Dẫn điện kém nhưng dẫn nhiệt tốt", "B": "Dẫn điện và dẫn nhiệt tốt", "C": "Có độ cứng cao và khối lượng riêng nhỏ", "D": "Không bị ăn mòn trong mọi điều kiện"}, "ans": "B"}, {"id": 179, "num": 179, "q": "So với nhôm (Al), ưu điểm chính của đồng (Cu) khi làm dây dẫn điện là gì?", "opts": {"A": "Nhẹ hơn, dễ chế tạo hơn", "B": "Giá thành rẻ hơn", "C": "Có độ dẫn điện cao hơn và bền cơ học tốt hơn", "D": "Ít bị oxy hóa hơn trong môi trường không khí"}, "ans": "C"}, {"id": 180, "num": 180, "q": "Một trong những nhược điểm của đồng (Cu) khi sử dụng làm dây dẫn điện là \n\ngì", "opts": {"A": "Dễ bị ăn mòn hơn nhôm", "B": "Khối lượng riêng lớn, gây khó khăn khi lắp đặt", "C": "Dẫn điện kém hơn sắt", "D": "Dễ gãy giòn trong điều kiện bình thường"}, "ans": "B"}, {"id": 181, "num": 181, "q": "Một trong những ưu điểm nổi bật của nhôm (Al) so với đồng (Cu) là gì", "opts": {"A": "Nhẹ hơn, giúp giảm tải trọng khi lắp đặt", "B": "Có độ dẫn điện cao hơn đồng", "C": "Chịu nhiệt tốt hơn và không bị oxy hóa", "D": "Dễ hàn hơn đồng"}, "ans": "A"}, {"id": 182, "num": 182, "q": "So với đồng (Cu), nhược điểm chính của nhôm (Al) khi làm dây dẫn điện là \n\ngì?", "opts": {"A": "Dẫn điện kém hơn", "B": "Khối lượng riêng lớn hơn", "C": "Dễ bị ăn mòn hơn trong môi trường không khí", "D": "Dễ bị gãy giòn hơn khi uốn"}, "ans": "A"}, {"id": 183, "num": 183, "q": "Ứng dụng phổ biến của nhôm (Al) trong ngành điện là gì?", "opts": {"A": "Làm dây dẫn trên đường dây truyền tải điện cao áp", "B": "Làm nam châm vĩnh cửu trong máy điện", "C": "Làm vật liệu cách điện trong cáp điện", "  từ cứng có độ từ thẩm lớn, Bdư cao, lực kháng từ và tổn hao từ trễ nhỏ.", "C": "Vật liệu từ cứng có độ từ thẩm bé, lực kháng từ và tổn hao từ trễ lớn.", "D": "Vật liệu từ cứng có độ từ thẩm bé, lực kháng từ và tổn hao từ trễ bé."}, "ans": "C"}, {"id": 209, "num": 209, "q": "Trình bày đặc trưng của vật liệu dùng làm nam châm vĩnh cửu?", "opts": {"A": "Chúng được đặc trưng bằng các tham số: độ từ thẩm, từ dư và năng lượng lớn nhất \n\nđưa vào không gian xung quanh.", "B": "Chúng được đặc trưng bằng các tham số: lực kháng từ, từ dư và tổn thất sắt từ.", "C": "Chúng được đặc trưng bằng các tham số: lực kháng từ, độ từ thẩm và năng lượng \n\nlớn nhất đưa vào không gian xung quanh.", "D": "Chúng được đặc trưng bằng các tham số: lực kháng từ, từ dư và năng lượng lớn nhất \n\nđưa vào không gian xung quanh."}, "ans": "D"}, {"id": 210, "num": 210, "q": "Cho biết các hiện tượng xảy ra trong vật liệu sắt từ dưới tác dụng của từ \n\ntrường ngoài?", "opts": {"A": "Hiện tượng lõi sắt bị nhiễm từ.", "B": "Hiện tượng hình thành các vùng từ hóa (các đô men), hiện tượng quay các véc tơ đô \n\nmen theo hướng từ trường ngoài và hiện tượng từ giảo.", "C": "Hiện tượng chuyển dịch mặt phân cách giữa các đô men, hiện tượng quay các véc tơ \n\nđô men theo hướng từ trường ngoài và hiện tượng từ giảo.", "D": "Hiện tượng hình thành và chuyển dịch mặt phân cách giữa các đô men, hiện tượng \ntừ giảo."}, "ans": "C"}, {"id": 211, "num": 211, "q": "Nguyên nhân gây nên từ tính của vật liệu?", "opts": {"A": "Là do vật liệu bị từ hóa bởi từ trường ngoài.", "B": "Là do trong vật liệu luôn tồn tại sẵn các dòng điện vòng.", "C": "Là do trong vật liệu tồn tại những vùng từ hóa tự nhiên.", "D": "Là do vật liệu bị nhiễm điện."}, "ans": "B"}, {"id": 212, "num": 212, "q": "Vật liêu sắt từ khác với vật liệu phi từ tính ở điểm nào nhất sau đây:", "opts": {"A": "Có thuộc tính của một nam châm.", "B": "Có tính dẫn từ cao.", "C": "Trong vật liệu tồn tại sẵn các miền từ hóa tự nhiên.", "D": "Dẫn điện kém hơn."}, "ans": "C"}, {"id": 213, "num": 213, "q": "Tính chất dẫn từ của vật liệu sắt từ được đặc trưng bởi tham số nào sau đây?", "opts": {"A": "Lượng từ thông lớn nhất có thể đi qua vật liệu (𝜙)", "B": "Giá trị từ cảm tại điểm bão hòa từ (Bbh)", "C": "Độ từ thẩm cực đại của vật liệu (𝜇max)", "D": "Cường độ từ trường lớn nhất có thể đi qua vật liệu (Hm)"}, "ans": "C"}];

var quiz=[], cur=0, uAns={}, oMaps={}, started=false;

function rnd(a){var b=[].concat(a);for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function startQuiz(){
  var n=Math.min(parseInt(document.getElementById('numQ').value)||30, ALL_Q.length);
  var mode=document.getElementById('modeSelect').value;
  var pool=[].concat(ALL_Q);
  if(mode!=='order') pool=rnd(pool);
  quiz=pool.slice(0,n);
  oMaps={};
  var letters=['A','B','C','D'];
  quiz.forEach(function(q){
    var disp=mode==='shuffle'?rnd(letters):[].concat(letters);
    var m={};
    for(var i=0;i<letters.length;i++) m[letters[i]]=disp[i];
    oMaps[q.id]=m;
  });
  uAns={};cur=0;started=true;
  document.getElementById('cfgbar').style.display='none';
  document.getElementById('progWrap').style.display='block';
  document.getElementById('summBox').style.display='none';
  renderQ();renderNav();updateScore();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function correctDisp(q){
  var m=oMaps[q.id]; var ans=q.ans;
  var ls=['A','B','C','D'];
  for(var i=0;i<ls.length;i++){if(m[ls[i]]===ans)return ls[i];}
  return 'A';
}

function renderQ(){
  var q=quiz[cur];
  var m=oMaps[q.id];
  var answered=uAns.hasOwnProperty(q.id);
  var chosen=uAns[q.id];
  var cd=correctDisp(q);
  var pct=Math.round((cur+1)/quiz.length*100);
  document.getElementById('progTxt').textContent='Câu '+(cur+1)+' / '+quiz.length;
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progFill').style.width=pct+'%';
  var ls=['A','B','C','D'];
  var optHTML=ls.map(function(d){
    var origL=m[d]; var text=q.opts[origL]||'';
    var cls='opt'; var dis=answered?'disabled':'';
    if(answered){
      if(d===cd) cls+=' correct';
      else if(d===chosen) cls+=' wrong';
    }
    return '<button class="'+cls+'" '+dis+' onclick="selAns('+q.id+',\''+d+'\')">'
      +'<span class="olbl">'+d+'</span><span>'+esc(text)+'</span></button>';
  }).join('');
  var prevDis=cur===0?'disabled':'';
  var nextDis=cur===quiz.length-1?'disabled':'';
  document.getElementById('quizArea').innerHTML=
    '<div class="card"><div class="qh"><div class="qnum">'+q.num+'</div>'
    +'<div class="qtext">'+esc(q.q)+'</div></div>'
    +'<div class="opts">'+optHTML+'</div>'
    +'<div class="navrow">'
    +'<button class="btn" onclick="goTo('+(cur-1)+')" '+prevDis+'>← Trước</button>'
    +'<button class="btn" onclick="goTo('+(cur+1)+')" '+nextDis+'>Tiếp →</button>'
    +'</div></div>';
}

function selAns(qid,d){
  if(uAns.hasOwnProperty(qid))return;
  uAns[qid]=d;
  updateScore();renderQ();renderNav();
  setTimeout(function(){
    if(cur<quiz.length-1) goTo(cur+1);
    else showSummary();
  },800);
}

function goTo(idx){if(idx<0||idx>=quiz.length)return;cur=idx;renderQ();renderNav();}

function renderNav(){
  var nav=document.getElementById('qnav');
  if(!started){nav.innerHTML='';return;}
  nav.innerHTML=quiz.map(function(q,i){
    var answered=uAns.hasOwnProperty(q.id);
    var cd=answered?correctDisp(q):null;
    var cls='qd';
    if(answered) cls+=(uAns[q.id]===cd)?' cd':' wd';
    if(i===cur) cls+=' cur';
    return '<div class="'+cls+'" onclick="goTo('+i+')" title="Câu '+q.num+'">'+q.num+'</div>';
  }).join('');
}

function updateScore(){
  var c=0,t=0;
  quiz.forEach(function(q){
    if(uAns.hasOwnProperty(q.id)){t++;if(uAns[q.id]===correctDisp(q))c++;}
  });
  document.getElementById('scoreBox').textContent='Đúng: '+c+' / '+t;
}

function showSummary(){
  var c=0,w=0,s=0;
  quiz.forEach(function(q){
    if(!uAns.hasOwnProperty(q.id)){s++;return;}
    if(uAns[q.id]===correctDisp(q))c++;else w++;
  });
  var pct=quiz.length?Math.round(c/quiz.length*100):0;
  document.getElementById('cntC').textContent=c;
  document.getElementById('cntW').textContent=w;
  document.getElementById('cntS').textContent=s;
  document.getElementById('scInner').textContent=pct+'%';
  var ring=document.getElementById('scRing');
  ring.style.background='conic-gradient(var(--correct) 0% '+pct+'%, #dadce0 '+pct+'% 100%)';
  document.getElementById('summBox').style.display='block';
  document.getElementById('summBox').scrollIntoView({behavior:'smooth'});
}

function restartQuiz(){
  started=false;
  document.getElementById('cfgbar').style.display='flex';
  document.getElementById('progWrap').style.display='none';
  document.getElementById('summBox').style.display='none';
  document.getElementById('quizArea').innerHTML='';
  document.getElementById('qnav').innerHTML='';
  document.getElementById('scoreBox').textContent='Đúng: 0 / 0';
}
</script>
