<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trắc Nghiệm Vật Liệu Điện</title>
<style>
:root{--primary:#1a73e8;--correct:#34a853;--wrong:#ea4335;--bg:#f0f4f9;--card:#fff;--border:#dadce0;--text:#202124;--muted:#5f6368}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
header h1{font-size:1.05rem;font-weight:700}
.hctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#scoreBox{background:rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;font-weight:600;font-size:.9rem;min-width:110px;text-align:center}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:600;transition:all .15s}
.btn-w{background:#fff;color:var(--primary)}.btn-w:hover{background:#e8f0fe}
.btn-o{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7)}.btn-o:hover{background:rgba(255,255,255,.12)}
.cfgbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cfgbar label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.cfgbar input[type=number]{width:70px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:.88rem}
.cfgbar select{padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:.88rem}
main{max-width:820px;margin:20px auto;padding:0 14px 48px}
.prog-wrap{margin-bottom:16px}
.prog-info{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:5px}
.prog-bar{height:6px;background:#dadce0;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--primary);transition:width .3s}
.card{background:var(--card);border-radius:12px;padding:22px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:18px}
.qh{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.qnum{background:var(--primary);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.qtext{font-size:.97rem;line-height:1.65;font-weight:500}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;background:#fff;text-align:left;font-size:.93rem;line-height:1.5;transition:all .15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--primary);background:#e8f0fe}
.olbl{background:#f1f3f4;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0;transition:all .15s}
.opt.correct{border-color:var(--correct);background:#e6f4ea}.opt.correct .olbl{background:var(--correct);color:#fff}
.opt.wrong{border-color:var(--wrong);background:#fce8e6}.opt.wrong .olbl{background:var(--wrong);color:#fff}
.opt:disabled{cursor:default}
.navrow{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.navrow .btn{background:var(--primary);color:#fff;padding:9px 22px}.navrow .btn:hover{background:#1557b0}.navrow .btn:disabled{background:#ccc;cursor:default}
.summary{background:var(--card);border-radius:12px;padding:28px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.1);display:none}
.summary h2{font-size:1.4rem;margin-bottom:10px}
.sc-ring{width:120px;height:120px;border-radius:50%;margin:18px auto;display:flex;align-items:center;justify-content:center;position:relative}
.sc-ring::after{content:'';position:absolute;width:88px;height:88px;border-radius:50%;background:#fff}
.sc-inner{position:relative;z-index:1;font-size:1.3rem;font-weight:700}
.ss{display:flex;gap:22px;justify-content:center;margin:14px 0 22px;flex-wrap:wrap}
.st{text-align:center}.sn{font-size:1.8rem;font-weight:700}.sl{font-size:.78rem;color:var(--muted)}
.sn.g{color:var(--correct)}.sn.r{color:var(--wrong)}.sn.b{color:var(--primary)}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px;justify-content:center}
.qd{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;cursor:pointer;border:2px solid transparent;background:#f1f3f4;color:var(--muted);transition:all .1s}
.qd.ans{background:#e8f0fe;color:var(--primary);border-color:var(--primary)}
.qd.cd{background:#e6f4ea;color:var(--correct);border-color:var(--correct)}
.qd.wd{background:#fce8e6;color:var(--wrong);border-color:var(--wrong)}
.qd.cur{box-shadow:0 0 0 2px var(--primary)}
@media(max-width:480px){.card{padding:14px}.qtext{font-size:.88rem}}
</style>
</head>
<body>
<header>
  <h1>🎓 Trắc Nghiệm Vật Liệu Điện</h1>
  <div class="hctrl">
    <div id="scoreBox">Đúng: 0 / 0</div>
    <button class="btn btn-o" onclick="restartQuiz()">🔀 Thi lại</button>
    <button class="btn btn-w" onclick="showSummary()">📊 Kết quả</button>
  </div>
</header>

<div class="cfgbar" id="cfgbar">
  <label>Số câu: <input type="number" id="numQ" value="30" min="5" max="213"></label>
  <label>Chế độ:
    <select id="modeSelect">
      <option value="shuffle">Tráo câu hỏi &amp; đáp án</option>
      <option value="shuffleQ">Chỉ tráo câu hỏi</option>
      <option value="order">Giữ thứ tự gốc</option>
    </select>
  </label>
  <button class="btn" style="background:var(--primary);color:#fff" onclick="startQuiz()">▶ Bắt đầu</button>
</div>

<main>
  <div class="prog-wrap" id="progWrap" style="display:none">
    <div class="prog-info"><span id="progTxt">Câu 1 / 30</span><span id="progPct">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div id="quizArea"></div>
  <div class="qnav" id="qnav"></div>
  <div class="summary" id="summBox">
    <h2>🎉 Kết quả bài thi</h2>
    <div class="sc-ring" id="scRing"><div class="sc-inner" id="scInner">0%</div></div>
    <div class="ss">
      <div class="st"><div class="sn g" id="cntC">0</div><div class="sl">Đúng</div></div>
      <div class="st"><div class="sn r" id="cntW">0</div><div class="sl">Sai</div></div>
      <div class="st"><div class="sn b" id="cntS">0</div><div class="sl">Chưa làm</div></div>
    </div>
    <button class="btn" style="background:var(--primary);color:#fff;font-size:.98rem;padding:11px 30px" onclick="restartQuiz()">🔀 Thi lại</button>
  </div>
</main>

<script>
var ALL_Q = [{"id": 1, "num": 1, "q": "Anh (chị) hãy đưa ra định nghĩa đầy đủ và chính xác nhất về tổn thất điện môi?", "opts": {"A": "Tổn thất điện môi là phần năng lượng phát sinh ra trong điện môi, trong một đơn vị \n\nthời gian làm cho điện môi nóng lên khi có điện trường bên ngoài tác động.", "B": "Tổn thất điện môi là phần năng lượng phát sinh ra trong điện môi làm cho điện môi \n\nnóng lên khi có điện trường bên ngoài tác động.", "C": "Tổn thất điện môi là phần năng lượng tích lũy trong điện môi, trong một đơn vị thời \ngian làm cho điện môi nóng lên.", "D": "Tổn thất điện môi là phần năng lượng cần thiết để định hướng các phân tử  lưỡng \n\ncực hoặc ion hoá các phân tử trung hòa dưới tác dụng của điện trường."}, "ans": "A"}, {"id": 2, "num": 2, "q": "Tổn thất điện môi trong vật liệu cách điện thường được đánh giá gián tiếp thông \n\nqua:", "opts": {"A": "Hệ số tổn hao: .tg.", "B": "Ptt = U2..C.tg", "C": "Độ lớn của dòng điện rò trong điện môi.", "D": "Góc tổn hao điện môi  ( hay tg)."}, "ans": "D"}, {"id": 3, "num": 3, "q": "Để so sánh mức độ tổn hao của các điện môi khác nhau trong cùng một điều \n\nkiện điện áp và tần số, người ta có thể đánh giá gián tiếp thông qua:", "opts": {"A": "Hệ số tổn hao: .tg.", "B": "Ptt = U2..C.tg", "C": "Độ lớn của dòng điện rò trong điện môi.", "D": "Góc tổn hao điện môi  ( hay tg)"}, "ans": "A"}, {"id": 4, "num": 4, "q": "Trong thực tế có nhiều yếu tố ảnh hưởng tới góc tổn thất điện môi của vật liệu \n\ncách điện, trong đó có 4 yếu tố quan trọng đó là:", "opts": {"A": "Nhiệt độ, tần số điện trường, độ ẩm của điện môi và áp suất môi trường.", "B": "Nhiệt độ, tần số điện trường, dạng điện trường và thời gian tác động của điện áp.", "C": "Nhiệt độ, tần số điện trường, độ ẩm của điện môi và môi trường, giá trị điện áp hay \ncường độ điện trường tác dụng lên điện môi.", "D": "Nhiệt độ, tần số điện trường, hằng số điện môi của vật liệu và độ ẩm không khí."}, "ans": "C"}, {"id": 5, "num": 5, "q": "Các dạng  tổn thất trong điện môi khí là:", "opts": {"A": "Tổn thất do dòng điện rò và tổn thất do ion hóa.", "B": "Tổn thất do dòng điện rò và tổn thất do phân cực lưỡng cực chậm.", "C": "Tổn thất do ion hóa và tổn thất do phân cực lưỡng cực chậm.", "D": "Tổn thất do tính không đồng nhất của điện môi khí."}, "ans": "A"}, {"id": 6, "num": 6, "q": "Các dạng  tổn thất trong điện môi lỏng trung hòa không có chứa loại tạp chất \n\nmà phân tử là lưỡng cực là:", "opts": {"A": "Tổn thất do ion hóa và tổn thất do phân cực lưỡng cực chậm.", "B": "Tổn thất do dòng điện rò và tổn thất do ion hóa.", "C": "Chỉ có tổn thất do dòng điện rò.", "D": "Tổn thất do tính không đồng nhất của điện môi lỏng."}, "ans": "C"}, {"id": 7, "num": 7, "q": "Các dạng  tổn thất trong điện môi lỏng cực tính là:", "opts": {"A": "Tổn thất do dòng điện rò và tổn thất do ion hóa.", "B": "Tổn thất do dòng điện rò và tổn thất do phân cực lưỡng cực chậm.", "C": "Tổn thất do ion hóa và tổn thất do phân cực lưỡng cực chậm.", "D": "Tổn thất do tính không đồng nhất của điện môi lỏng."}, "ans": "B"}, {"id": 8, "num": 8, "q": "Phát biểu nào dưới đây không đúng về tổn thất điện môi trong điện môi lỏng?", "opts": {"A": "Trong điện môi lỏng trung hòa, tổn thất điện môi chỉ do dòng điện rò gây ra nếu \n\nđiện môi lỏng không chứa tạp chất có các phân tử lưỡng cực", "B": "Trong chất lỏng cực tính có độ nhớt bé, khi làm việc trong điện trường tần số thấp, \n\ntổn thất do phân cực chậm có trị số nhỏ không đáng kể và có thể nhỏ hơn tổn thất do \n\ndòng điện rò.", "C": "Ở chất lỏng cực tính mạnh - có điện dẫn nhỏ, tổn thất do phân cực chậm là rất lớn \n\nnên chất lỏng không sử dụng làm điện môi được.", "D": "Ở điện môi lỏng lưỡng cực tổn thất điện môi phụ thuộc vào nhiệt độ."}, "ans": "C"}, {"id": 9, "num": 9, "q": "Phát biểu nào sau đây về cách điện thể khí là không đúng ?", "opts": {"A": "Ở điều kiện bình thường và điện trường yếu, tổn thất trong điện môi khí rất bé.", "B": "Nguyên nhân gây nên tổn thất trong điện môi khí chủ yếu là do dòng điện dẫn, ở \nđiện áp cao có thể xuất hiện tổn thất do ion hóa.", "C": "Khi áp suất khí tăng thì độ bền điện (Eđt) của điện môi khí tăng; khi áp suất khí \n\ngiảm và độ chân không cao thì độ bền điện của chất khí sẽ giảm đi nhiều.", "D": "Ở điều kiện bình thường, mật độ phân tử khí rất nhỏ nên sự phân cực trong điện môi \n\nkhí là không đáng kể,   1."}, "ans": "C"}, {"id": 10, "num": 10, "q": "Khi điện môi nằm trong điện trường được thay thế bằng một sơ đồ đẳng trị \ngồm tụ điện lý tưởng mắc song song (Cs) với một điện trở (Rs), thì công suất tổn thất \nđiện môi được xác định theo công thức:", "opts": {"A": "", "B": "", "C": "", "D": ", với \n\n, với \n\n, với \n\n. \n\n. \n\n. \n\n, với \n\n."}, "ans": "A"}, {"id": 11, "num": 11, "q": "Khi điện môi nằm trong điện trường được thay thế bằng một sơ đồ đẳng trị \ngồm tụ điện lý tưởng mắc nối tiếp (Cn) với một điện trở (Rn), thì công suất tổn thất điện \n\nmôi được xác định theo công thức:", "opts": {"A": "", "B": "", "C": "", "D": ", với \n\n, với \n\n, với \n\n, với \n\n. \n\n. \n\n. \n\n."}, "ans": "A"}, {"id": 12, "num": 12, "q": "Theo đặc điểm và bản chất vật lý có thể chia tổn hao điện môi thành các dạng \n\nchính sau đây:", "opts": {"A": "Tổn hao trong điện môi khí, tổn hao trong điện môi lỏng và tổn hao trong điện môi \n\nrắn.", "B": "Tổn hao do dòng điện rò, tổn hao do dòng phân cực chậm.", "C": "Tổn hao điện môi do dòng điện rò, tổn hao do dòng phân cực chậm, tổn hao do ion \n\nhoá, tổn hao do tính không đồng nhất của điện môi.", "D": "Tổn hao điện môi do nhiệt độ, tổn hao do tần số điện trường, tổn hao do tác dụng \n\ncủa điện áp, tổn hao do tác dụng của độ ẩm không khí."}, "ans": "C"}, {"id": 13, "num": 13, "q": "Cho các nhận xét về tồn hao điện môi do dòng điện rò dưới đây, theo anh (chị) \nnhận xét nào chính xác nhất?", "opts": {"A": "Hệ số tổn thất điện môi do dòng điện rò tỷ lệ nghịch với tần số điện trường, hằng số \n\nđiện môi và tăng theo hàm số mũ khi nhiệt độ tăng.", "B": "Hệ số tổn thất điện môi do dòng điện rò tỷ lệ nghịch với tần số điện trường, hằng số \nđiện môi và nhiệt độ. \n\n2...ttsPUCtg=1sstgCR=...ttsPUCtg=1sstgCR=2...ttsPUCtg=sstgCR=2...ttssPUCRtg=1sstgCR=22...1nttUCtgPtg=+nntgCR=2...1nttUCtgPtg=+nntgCR=2...1nttUCtgPtg=+nntgCR=22...1nttUCtgPtg=+1nntgCR=", "C": "Hệ số tổn thất điện môi do dòng điện rò tỷ lệ nghịch với nhiệt độ, tần số điện trường \n\nvà tỷ lệ thuận với hằng số điện môi.", "D": "Hệ số tổn thất điện môi do dòng điện rò chỉ phụ thuộc vào nhiệt độ, tần số mà \n\nkhông phụ thuộc vào hằng số điện môi."}, "ans": "A"}, {"id": 14, "num": 14, "q": "Nguyên nhân gây nên tổn hao điện môi do phân cực lưỡng cực chậm được \n\nhiểu là:", "opts": {"A": "Trong quá trình định hướng, các phân tử lưỡng cực sẽ hấp thụ năng lượng điện \n\ntrường và gây nên tổn hao điện môi.", "B": "Tổn hao điện môi do phân cực lưỡng cực chậm được gây nên bởi sự phá huỷ chuyển \n\nđộng nhiệt của các phân tử lưỡng cực dưới tác động của cường độ điện trường.", "C": "Tổn hao điện môi do phân cực lưỡng cực chậm được gây nên bởi chuyển động nhiệt \n\ncủa các phân tử lưỡng cực.", "D": "Do xuất hiện sự ion hóa các phân tử lưỡng cực gây nên."}, "ans": "B"}, {"id": 15, "num": 15, "q": "Cho các nhận xét dưới đây về tổn hao điện môi do phân cực lưỡng cực chậm \n\nphụ thuộc vào nhiệt độ, theo anh (chị) nhận xét nào chính xác nhất?", "opts": {"A": "Khi nhiệt độ tăng, tổn thất điện môi do phân cực lưỡng cực chậm giảm.", "B": "Khi nhiệt độ tăng, tổn thất điện môi do phân cực lưỡng cực chậm tăng.", "C": "Khi nhiệt độ tăng, tổn thất điện môi do phân cực lưỡng cực chậm tăng, đạt trị số cực \n\nđại ở một nhiệt độ nào đó, sau đó lại giảm dần khi nhiệt độ tiếp tục tăng.", "D": "Tổn thất điện môi do phân cực lưỡng cực chậm ít phụ thuộc vào nhiệt độ."}, "ans": "C"}, {"id": 16, "num": 16, "q": "Cho các đồ thị dưới đây, theo anh (chị) hình nào mô tả mối quan hệ tg = f(T0), \nkhi tần số là không đổi, đối với dạng tổn thất điện môi do phân cực lưỡng cực chậm gây \n\nnên.", "opts": {"A": "Hình 1.", "B": "Hình 3.", "C": "Hình 2.", "D": "Hình 4."}, "ans": "B"}, {"id": 17, "num": 17, "q": "Cho các đồ thị dưới đây, theo anh (chị) hình nào mô tả mối quan hệ \n\n, khi tần số điện trường là hằng số, đối với dạng tổn thất điện môi do dòng điện rò.", "opts": {"A": "Hình 1.", "B": "Hình 2.", "C": "Hình 3.", "D": "Hình 4."}, "ans": "B"}, {"id": 18, "num": 18, "q": "Cho các đồ thị dưới đây, theo anh (chị) hình nào mô tả mối quan hệ \n\n, khi nhiệt độ là hằng số, đối với dạng tổn thất điện môi do dòng điện rò.", "opts": {"A": "Hình 3.", "B": "Hình 2.", "C": "Hình 1.", "D": "Hình 4."}, "ans": "C"}, {"id": 19, "num": 19, "q": "Cho các đồ thị dưới đây, theo anh (chị) hình nào mô tả mối quan hệ \n\n, khi nhiệt độ là không đổi, đối với điện môi có tổn thất chủ yếu do phân cực lưỡng cực \n\nchậm. \n\n()0tgfT=()tgf=()tgff=", "opts": {"A": "Hình 1.", "B": "Hình 2.", "C": "Hình 3.", "D": "Hình 4."}, "ans": "A"}, {"id": 20, "num": 20, "q": "Cho các đồ thị dưới đây, theo anh (chị) hình nào mô tả mối quan hệ của tổn thất \n\nđiện môi theo độ ẩm của vật liệu \n\n, khi nhiệt độ và tần số không đổi.", "opts": {"A": "Hình 3.", "B": "Hình 1.", "C": "Hình 2.", "D": "Hình 4."}, "ans": "A"}, {"id": 21, "num": 21, "q": "Cho các nhận xét sau về tổn thất trong điện môi khí, anh (chị) hãy chỉ ra nhận \n\nxét nào KHÔNG CHÍNH XÁC?", "opts": {"A": "Ở điện áp cao quá trình ion hóa chất khí diễn ra mạnh mẽ, do đó tổn thất điện môi \n\ncó giá trị đáng kể.", "B": "Nguyên nhân gây nên tổn thất điện môi của điện môi khí chủ yếu là do dòng điện rò, \n\ncòn sự định hướng của các phân tử khí lưỡng cực không kèm theo tổn thất.", "C": "Điện dẫn của điện môi khí có trị số bé, do đó tổn hao điện môi sẽ bé không đáng kể, \n\nkể cả ở tần số cao.", "D": "Nguyên nhân gây nên tổn thất điện môi của điện môi khí lưỡng cực chủ yếu là do \nphân cực lưỡng cực chậm gây nên."}, "ans": "D"}, {"id": 22, "num": 22, "q": "Với điện môi lỏng, phát biểu nào sau đây là không chính xác:", "opts": {"A": "Với điện môi lỏng trung hòa: tổn thất điện môi chỉ do độ dẫn điện gây nên nếu như \nchất lỏng không chứa tạp chất có các phân tử lưỡng cực.", "B": "Với điện môi lỏng cực tính, ngoài tổn thất do điện dẫn còn có tổn thất do sự phân \n\ncực lưỡng cực chậm gây nên.", "C": "Chất lỏng trung hòa không sử dụng trong môi trường làm việc có tần số cao.", "D": "Mức độ tổn thất trong điện môi lỏng phụ thuộc vào nhiệt độ, tần số và hàm lượng \n\nhơi ẩm có trong điện môi. \n\n()%tgf="}, "ans": "C"}, {"id": 23, "num": 23, "q": "Ở điều kiện bình thường, nhựa cánh kiến có  = 3,5; tg = 0,01, nhựa thông có \n\n = 2,8; tg  0,015. Giả sử hai khối điện môi có cùng kích thước và cùng chịu tác \n\nđộng của một loại điện áp. Anh (chị) hãy so sánh công suất tổn thất của hai loại điện \n\nmôi trên?", "opts": {"A": "Công suất tổn thất của nhựa thông lớn hơn.", "B": "Công suất tổn thất của nhựa cánh kiến lớn hơn.", "C": "Công suất tổn thất của hai loại nhựa trên bằng nhau.", "D": "Chưa thể so sánh chính xác được vì còn tùy thuộc vào mức điện áp."}, "ans": "A"}, {"id": 24, "num": 24, "q": "Ở điều kiện t = 200 C, Sứ cánh điện có   5,5; tg  0,04, Thuỷ tinh ít kiềm có \n\n  7,5; tg  0,03. Giả sử hai khối điện môi có cùng kích thước và cùng chịu tác động \n\ncủa một loại điện áp trong cùng một điều kiện môi trường. Anh (chị) hãy so sánh công \n\nsuất tổn thất của hai loại điện môi trên?", "opts": {"A": "Công suất tổn thất của Sứ cách điện lớn hơn.", "B": "Công suất tổn thất của Thuỷ tinh ít kiềm lớn hơn.", "C": "Công suất tổn thất của hai điện môi trên bằng nhau.", "D": "Chưa thể so sánh chính xác được vì yếu tố môi trường chưa xác định."}, "ans": "C"}, {"id": 25, "num": 25, "q": "Cho đồ thị dưới đây, theo anh (chị) đường cong nào mô tả mối quan hệ \n\ncủa điện môi cực tính mạnh có điện dẫn nhỏ, khi nhiệt độ là hằng số. \n\ntg \n\n3 \n\n2 \n\n1 \n\n", "opts": {"A": "Đường 3.", "B": "Đường 2.", "C": "Đường 1.", "D": "Đường 1, 2."}, "ans": "B"}, {"id": 26, "num": 26, "q": "Tổn thất trọng các điện môi trung hòa, điện môi có cực tính yếu khi làm việc \n\ntrong môi trường ẩm có thể gây bởi nguyên nhân chính nào sau:", "opts": {"A": "Sự gia tăng dòng rò trong điện môi.", "B": "Sự gia tăng phân cực lưỡng cực của hơi ẩm trong điện môi. \n\n()=ftg", "C": "Sự ion hóa hơi ẩm có trong điện môi.", "D": "Do phân bố của hơi ẩm không đều trong điện môi."}, "ans": "A"}, {"id": 27, "num": 27, "q": "Theo anh (chị), quá trình ion hoá do va chạm xảy ra trong vật liệu cách điện là \ndo…?", "opts": {"A": "Khi cường độ điện trường đặt lên điện môi đủ lớn, các điện tử sẽ bứt ra khỏi phân \n\ntử, cường độ điện trường càng mạnh lượng điện tử bứt ra càng nhiều. Quá trình đó \nđược gọi là quá trình ion hoá do va chạm.", "B": "Khi cường độ điện trường đặt lên điện môi đủ lớn, những điện tích có trong điện \n\nmôi sẽ nhận được năng lượng và tăng tốc, khi va chạm với phân tử trung hoà sẽ gây \n\nnên ion hoá.", "C": "Ion hoá do va chạm là quá trình tách các điện tử ra khỏi phân tử hoặc ion, khi phân \n\ntử (hay ion) hấp thụ năng lượng đủ lớn do va chạm từ các hạt điện tích tự do chuyển \n\nđộng có động năng lớn trong điện trường mạnh.", "D": "Ion hoá do va chạm là quá trình kết hợp điện tử tự do và ion dương để tạo thành một \n\nphân tử trung hòa."}, "ans": "C"}, {"id": 28, "num": 28, "q": "Quá trình tái hợp xảy ra đồng thời với quá trình ion hóa điện môi khi trong \n\nđiện trường được hiểu là…?", "opts": {"A": "quá trình tách các điện tử ra khỏi phân tử hoặc ion, khi phân tử (hay ion) hấp thụ \n\nnăng lượng đủ lớn, từ bên ngoài.", "B": "quá trình kết hợp giữa các điện tử tự do và các ion dương để tạo thành phân tử trung \n\nhòa, khi đó năng lượng sẽ được giải phóng dưới dạng các photon.", "C": "quá trình các điện tử được bứt ra khỏi phân tử, nguyên tử; cường độ điện trường \n\ncàng mạnh lượng điện tử bứt ra càng nhiều.", "D": "quá trình kết hợp giữa các ion âm và ion dương gây bởi lực hút tĩnh điện."}, "ans": "B"}, {"id": 29, "num": 29, "q": "Các dạng ion hóa trong  điện môi khí có thể là:", "opts": {"A": "Ion hoá va chạm, ion hoá quang, và ion hoá bề mặt.", "B": "Ion hoá va chạm, ion hoá quang, ion hoá nhiệt và ion hoá bề mặt.", "C": "Ion hoá va chạm, ion hoá quang, ion hoá nhiệt.", "D": "Ion hoá va chạm, ion hoá quang, ion hoá nhiệt và ion hoá tự nhiên."}, "ans": "B"}, {"id": 30, "num": 30, "q": "Theo bản chất của quá trình hình thành dòng plazma ta có các dạng phóng điện \n\ntrong điện môi khí sau:", "opts": {"A": "Phóng điện điện áp một chiều, xoay chiều, và điện áp xung.", "B": "Phóng điện toả sáng, phóng điện tia lửa, phóng điện hồ quang.", "C": "Phóng điện trong điện trường đồng nhất và phóng điện trong điện trường không \n\nđồng nhất.", "D": "Phóng điện toả sáng, phóng điện tia lửa, phóng điện hồ quang, phóng điện vầng \n\nquang."}, "ans": "D"}, {"id": 31, "num": 31, "q": "Theo anh (chị), thế nào là điện trường đồng nhất (điện trường đều)?", "opts": {"A": "Điện trường đồng nhất là điện trường ở vùng không gian giữa hai bản cực song \nsong.", "B": "Điện trường đồng nhất là điện trường lý tưởng, có cường độ điện trường tại mọi \n\nđiểm trong không gian giữa hai bản cực là như nhau.", "C": "Điện trường đồng nhất là điện trường giữa 2 bản cực phẳng song song và có diện \n\ntích bằng nhau.", "D": "Điện trường đồng nhất là điện trường ở vùng không gian giữa hai bản cực có bán \n\nkính cong rất nhỏ so với khoảng cách giữa chúng."}, "ans": "B"}, {"id": 32, "num": 32, "q": "Theo anh (chị), các phát biểu sau về điện trường không đồng nhất, phát biểu \n\nnào không chính xác?", "opts": {"A": "Là điện trường ở vùng không gian giữa một bên là điện cực mũi nhọn (kim) và một \n\nbên là điện cực phẳng.", "B": "Là điện trường ở vùng không gian giữa hai bản cực có bán kính cong rất nhỏ so với \n\nkhoảng cách giữa chúng (mũi nhọn).", "C": "Là điện trường có cường độ điện trường tại các điểm khác nhau trong không gian \n\ncủa điện cực, không bằng nhau.", "D": "Là điện trường tạo bởi điện áp xoay chiều."}, "ans": "D"}, {"id": 33, "num": 33, "q": "Những lý thuyết nào sau đây được dùng để giải thích quá trình đánh thủng \n\ntrong điện môi lỏng?", "opts": {"A": "Lý thuyết đánh thủng về nhiệt, lý thuyết đánh thủng thuần tuý do điện.", "B": "Lý thuyết đánh thủng về nhiệt, lý thuyết đánh thủng vì nhiệt và ion hoá.", "C": "Lý thuyết về nhiệt, lý thuyết phản ion hoá.", "D": "Lý thuyết đánh thủng về nhiệt, lý thuyết đánh thủng do điện hoá."}, "ans": "A"}, {"id": 34, "num": 34, "q": "Quá trình phóng điện trong điện môi lỏng tương đối phức tạp và chịu ảnh \n\nhưởng của nhiều yếu tố, song có các yếu tố cơ bản là:", "opts": {"A": "Tạp chất (nước, bụi bẩn...), nhiệt độ, áp suất trong chất lỏng và thời gian tác động \ncủa điện áp.", "B": "Tạp chất (nước, bụi bẩn...), nhiệt độ, tần số điện trường và thời gian tác động của \n\nđiện áp.", "C": "Tạp chất (nước, bụi bẩn ...), nhiệt độ, tần số điện trường và độ ẩm không khí.", "D": "Tạp chất (nước, bụi bẩn ...), nhiệt độ, áp suất và độ ẩm không khí."}, "ans": "A"}, {"id": 35, "num": 35, "q": "Sự đánh thủng trong điện môi rắn tương đối phức tạp, người ta phân biệt thành \nbốn dạng đánh thủng điện môi rắn là:", "opts": {"A": "Sự đánh thủng trong điện trường đồng nhất, điện trường không đồng nhất, điện \n\ntrường một chiều và điện trường xoay chiều.", "B": "Sự đánh thủng do nhiệt, sự đánh thủng do điện, do điện hoá và do phản ion hoá.", "C": "Sự đánh thủng trong điện áp một chiều, xoay chiều tần số thấp, xoay chiều tần số \n\ncao và điện áp xung.", "D": "Sự đánh thủng do điện các điện môi rắn vĩ mô đồng nhất, sự đánh thủng do điện  \n\ncác điện môi rắn không đồng nhất, sự đánh thủng do điện – hoá và sự đánh thủng do \nnhiệt."}, "ans": "D"}, {"id": 36, "num": 36, "q": "Cường độ trường đánh thủng của một điện môi khí trong trường đồng nhất phụ \n\nthuộc vào các yếu tố nào sau đây:", "opts": {"A": "Nhiệt độ, áp suất khí.", "B": "Khoảng cách giữa các điện cực, hình dạng của điện cực.", "C": "Thời gian tác động của điện áp và cực tính của điện áp đặt lên các điện cực.", "D": "Nhiệt độ, áp suất khí và khoảng cách giữa các điện cực."}, "ans": "D"}, {"id": 37, "num": 37, "q": "Trong điện trường không đồng nhất, tác dụng nâng cao điện áp đánh thủng \n\nđiện môi khí của màn chắn sẽ giảm đi khi càng dịch màn chắn gần với điện cực có bán \n\nkính cong nhỏ (dưới ¼ khoảng cách giữa các điện cực ) là vì:", "opts": {"A": "Điện trường giữa mũi nhọn – màn chắn tăng cao gây đánh thủng màn chắn.", "B": "Các điện tích phân bố trở nên cục bộ trên màn chắn, tính đồng nhất của điện trường \n\ngiữa màn chắn và cực bản giảm xuống.", "C": "Tác dụng ngăn cản dòng điện tích từ phía mũi nhọn sang phía cực bản của màn chắn \n\nkhông còn.", "D": "Vầng quang phát triển mạnh ra phía sau màn chắn."}, "ans": "B"}, {"id": 38, "num": 38, "q": "Trong điện trường không đồng nhất, tác dụng nâng cao điện áp đánh thủng \n\nđiện môi khí của màn chắn sẽ giảm đi khi càng dịch màn chắn gần với điện cực phẳng \n(nhỏ hơn ¾ khoảng cách giữa các điện cực) là vì:", "opts": {"A": "Điện trường giữa màn chắn – cực bản tăng cao gây đánh thủng màn chắn.", "B": "Vùng gần đồng nhất của điện trường giữa màn chắn và cực bản giảm xuống, trường \nphân bố giữa mũi nhọn và cực bản ít thay đổi so với khi không có màn chắn.", "C": "Tác dụng ngăn cản dòng điện tích từ phía mũi nhọn sang phía cực bản của màn chắn \n\nkhông còn.", "D": "Điện trường phía điện cực mũi nhọn tăng lên, vầng quang phát triển to ra."}, "ans": "B"}, {"id": 39, "num": 39, "q": "Tác dụng của màn chắn trong trường không đồng nhất là làm tăng được điện \n\náp đánh thủng điện môi khí bởi vì:", "opts": {"A": "Màn chắn cải thiện đáng kể sự phân bố của điện trường trong khoảng cực, trường \nphân bố trở nên đồng nhất hơn.", "B": "Màn chắn ngăn cản dòng điện tích lan truyền từ mũi nhon sang cực bản.", "C": "Màn chắn trung hòa hết các điện tích dịch chuyển đến.", "D": "Màn chắn hấp thụ một phần năng lượng của các điện tích dịch chuyển qua."}, "ans": "A"}, {"id": 40, "num": 40, "q": "Điện áp phóng điện bề mặt của điện môi rắn phụ thuộc cơ bản vào các yếu tố \n\nsau, tìm đáp án đúng nhất:", "opts": {"A": "Tình trạng bề mặt của điên môi (ẩm, bẩn…);", "B": "Nhiệt độ, độ ẩm của không khí, hình dạng của điện cực …", "C": "Tình trạng bề mặt của điên môi (ẩm, bẩn…); nhiệt độ, áp suất và độ ẩm của không \n\nkhí; dạng phân bố của điện trường, hình dạng của điện cực và thời gian tác động của \n\nđiện áp…", "D": "Hình dạng bề mặt của điên môi, nhiệt độ và thời gian nung nóng bề mặt điện môi."}, "ans": "C"}, {"id": 41, "num": 41, "q": "Khi áp suất trong  điện môi khí tăng thì độ bền điện của khí tăng hay giảm, vì \n\nsao?", "opts": {"A": "Sẽ tăng; vì mật độ phân tử khí tăng, quãng đường dịch chuyển tự do của điện tích có \n\ntrong điện môi trước khi va chạm vào phân tử khí giảm, nên để động năng tích lũy của \n\nđiện tích đạt được năng lượng gây ion hóa cần phải tăng cường độ trường trên khoảng \n\nkhí.", "B": "Sẽ giảm; Vì mật độ phân tử khí tăng, khả năng va chạm giữa các phân tử khí tăng, \nnên dễ xảy ra ion hóa do đó độ bền điện sẽ giảm.", "C": "Sẽ tăng; Vì mức độ tái hợp của một số ít các điện tích tự do trong chất khí sẽ tăng, \nđiều kiện dẫn đến ion hóa giảm nên độ bền điện của khí sẽ tăng.", "D": "Sẽ giảm; Vì mật độ phân tử khí tăng, đồng thời cũng làm tăng mật độ các điện tích \n\ntự do, điều kiện dẫn đến sự ion hóa do va chạm dễ xảy ra do đó độ bền điện sẽ giảm."}, "ans": "A"}, {"id": 42, "num": 42, "q": "Các phát biểu nào về sự đánh thủng trong điện môi rắn là không chính xác:", "opts": {"A": "Sự đánh thủng của điện môi rắn vĩ mô đồng nhất trong trường đồng nhất xảy ra tức \n\nthì khi cường độ trường đặt vào điện môi vượt quá trị số giới hạn.", "B": "Cường độ trường đánh thủng trong điện môi rắn không đồng nhất ít phụ thuộc vào \n\ntrường là đồng nhất hay không đồng nhất.", "C": "Cường độ trường đánh thủng trong điện môi rắn đồng nhất phụ thuộc nhiều vào \n\ntrường là đồng nhất hay không đồng nhất.", "D": "Trong điện trường đồng nhất, cường độ trường đánh thủng điện môi rắn vĩ mô đồng \n\nnhất tăng khi bề dầy điện môi tăng."}, "ans": "D"}, {"id": 43, "num": 43, "q": "Trong đánh thủng điện môi khí, phát biểu nào sau đây về tác dụng của màn \n\nchắn trong trường không đồng nhất là không chính xác:", "opts": {"A": "Màn chắn có tác dụng nâng cao Eđt nhưng không vượt quá Eđt khi trường là đồng \n\nnhất.", "B": "Màn chắn chỉ phát huy tác dụng trong điện trường một chiều.", "C": "Màn chắn phát huy tác dụng tốt nhất khi mũi nhọn có cực tính dương", "D": "Khả năng cách điện của bản thân màn chắn ít ảnh hưởng đến cách điện của khoảng \n\nkhí giữa 2 điện cực."}, "ans": "B"}, {"id": 44, "num": 44, "q": "Trong những nhận xét sau về đánh thủng điện môi khí, theo anh (chị), nhận xét \n\nnào là KHÔNG CHÍNH XÁC?", "opts": {"A": "Đối với điện môi khí, điện áp đánh thủng chất khí trong điện trường không đồng \n\nnhất cao hơn trong điện trường đồng nhất khi nhiệt độ, áp suất khí và khoảng cách giữa \n\ncác điện cực không đổi.", "B": "Đối với điện môi khí, cường độ điện trường đánh thủng chất khí sẽ tăng khi áp suất \n\nkhí tăng (nhiệt độ, khoảng cách giữa hai điện cực là không đổi).", "C": "Trong điện trường đồng nhất, cường độ trường đánh thủng chất khí sẽ giảm khi \n\nkhoảng cách giữa các điện cực tăng lên, (nhiệt độ và áp suất khí là không đổi).", "D": "Trong điện trường không đồng nhất, trước khi xảy ra sự đánh thủng chất khí thường \n\nxuất hiện vầng quang, vầng quang sẽ chuyển sang phóng điện tia lửa khi điện áp tăng \n\nlên."}, "ans": "A"}, {"id": 45, "num": 45, "q": "Trong những nhận xét sau về nâng cao điện áp đánh thủng của chất khí, theo \nanh (chị), nhận xét nào là KHÔNG CHÍNH XÁC?", "opts": {"A": "Đối với điện trường đồng nhất, một trong những biện pháp để nâng cao điện áp \n\nđánh thủng của chất khí là nén chất khí dưới áp suất cao.", "B": "Đối với điện trường không đồng nhất, màn chắn chỉ có tác dụng khi điện cực mũi \nnhọn (có bán kính cong nhỏ) mang cực tính dương.", "C": "Để nâng cao điện áp phóng điện chất khí trong trường không đồng nhất, việc cần \n\nthiết là cải thiện sự phân bố điện trường sao cho đồng nhất hơn, bằng cách sử dung \nmàn chắn.", "D": "Màn chắn thường là một tấm cách điện mỏng đặt trùng với phương của mặt đẳng \n\nthế và ở vị trí thích hợp giữa hai điện cực."}, "ans": "B"}, {"id": 46, "num": 46, "q": "Theo anh (chị) đồ thị nào dưới đây mô tả mối quan hệ Eđt = f(h) của điện môi \nkhí trong điện trường đồng nhất (Eđt: cường độ trường đánh thủng, h: khoảng cách giữa \ncác điện cực) ? \n\nEđt \n\nEđt \n\nEđt \n\nEđt \n\n0 \n\nHình 1 \n\n0 \n\nh \n\nHình 2 \n\n0 \n\n h \n\nHình 3 \n\nh \n\n0 \n\nHình 4 \n\n h", "opts": {"A": "Hình 3", "B": "Hình 2", "C": "Hình 1", "D": "Hình 4"}, "ans": "C"}, {"id": 47, "num": 47, "q": "Theo anh (chị) đồ thị nào dưới đây mô tả mối quan hệ Eđt = f(P) của điện môi \n\nkhí, trong điện trường đồng nhất (Eđt: độ bền điện, P: áp suất chất khí)? \n\nEđt \n\nEđt \n\nEđt \n\nEđt \n\n0 \n\nHình 1 \n\n0 \n\nP \n\nHình 2 \n\n0 \n\n P \n\nHình 3 \n\nP \n\n0 \n\nHình 4 \n\n P", "opts": {"A": "Hình 4", "B": "Hình 1", "C": "Hình 3", "D": "Hình 2"}, "ans": "D"}, {"id": 48, "num": 48, "q": "Những phát biểu sau đây về đánh thùng điện môi rắn, phát biểu nào không \nđúng:", "opts": {"A": "Sự đánh thủng cách điện thuần túy do nhiệt ở điều kiện làm việc thông thường đòi \nhỏi một thời gian tác động đủ dài của điện áp.", "B": "Sự đánh thủng cách điện thuần túy do điện ở điện áp cao đòi hỏi một thời gian tác \n\nđộng dài của điện áp.", "C": "Đối với phóng điện xung, thời gian tác động của điện áp càng nhỏ thì trị số của điện \n\náp đánh thủng cách điện càng cao.", "D": "Trị số điện áp xung xảy ra phóng điện trên điện môi phụ thuộc vào cực tính của điện \n\ncực đặt lên điện môi."}, "ans": "B"}, {"id": 49, "num": 49, "q": "Phát biểu nào sau đây về đặc điểm của đánh thủng điện môi khí, phát biểu nào \n\nlà không chính xác:", "opts": {"A": "Sự đánh thủng trong điện trường đồng nhất xảy ra tức thời khi điện áp đạt đến một \n\ntrị số nhất định tuỳ thuộc vào nhiệt độ và áp suất của khí.", "B": "Sự đánh thủng trong điện trường không đồng nhất xảy ra trước hết là hiện tượng \n\nphóng điện một phần dưới dạng vầng quang tại những chỗ mà ở đó cường độ điện \n\ntrường đạt đến trị số tới hạn.", "C": "Sự đánh thủng trong điện trường không đồng nhất giữa mũi nhọn - mặt phẳng khi \n\nmũi nhọn có cực tính dương là khó khăn hơn so với trường hợp mũi nhọn có cực tính \n\nâm.", "D": "Khi điện cực mũi nhọn có cực tính âm, vầng quang dễ phát triển hơn so với khi nó \n\nmang cực tính dương."}, "ans": "C"}, {"id": 50, "num": 50, "q": "Những phát biểu sau đây về đánh thủng điện môi, phát biểu nào là không hoàn \n\ntoàn chính xác:", "opts": {"A": "Mỗi điện môi nằm trong điện trường sẽ mất thuộc tính cách điện nếu cường độ điện \n\ntrường vượt quá trị số giới hạn cho phép nào đó gọi là hiện tượng đánh thủng điện môi.", "B": "Đánh thủng điện môi làm cho cách điện bị xuyên thủng. Vật liệu cách điện thể khí \n\nhoặc thể lỏng chỉ bị xuyên thủng trong giây lát, còn cách điện thể rắn bị phá huỷ vĩnh \n\nviễn, không sử dụng lại được.", "C": "Đánh thủng chất khí là kết quả của hiện tượng ion hoá do va chạm và ion hoá \n\nquang.", "D": "Nguyên nhân xảy ra đánh thủng điện môi lỏng chủ yếu là do hậu quả của quá trình \nnhiệt."}, "ans": "B"}, {"id": 51, "num": 51, "q": "Những nhận xét sau về phóng điện vầng quang trên đường dây cao áp, nhận \nxét nào là không chính xác:", "opts": {"A": "Vầng quang là một dạng phóng điện tự duy trì.", "B": "Sự có mặt của vầng quang làm gia tăng dòng điện rò, gây tổn hao năng lượng. \n\nNgoài ra trường điện từ của vầng quang còn gây nhiễu loạn đối với thông tin hữu tuyến \nvà vô tuyến lân cận …", "C": "Sự xuất hiện của vầng quang có tác dụng tích cực trong bảo vệ hệ thống điện chống \n\nquá điện áp khí quyển.", "D": "Vầng quang gây ăn mòn điện cực (vật dẫn)."}, "ans": "C"}, {"id": 52, "num": 52, "q": "Loại phóng điện nào dưới đây chỉ xảy ra với điều kiện áp suất chất khí phải \n\nthấp ?", "opts": {"A": "Phóng điện tia lửa", "B": "Phóng điện tỏa sáng", "C": "Phóng điện hồ quang", "D": "Phóng điện vầng quang"}, "ans": "B"}, {"id": 53, "num": 53, "q": "Những phát biểu sau về sự đánh thủng điện môi rắn đồng nhất, phát biểu nào \n\nlà không chính xác:", "opts": {"A": "Sự đánh thủng xảy ra gần như tức thời khi điện áp đặt vào điện môi vượt quá một trị \n\nsố giới hạn nào đó đối với từng loại vật liệu.", "B": "Quá trình đánh thủng thực chất là quá trình ion hóa bản thân phân tử chất rắn.", "C": "Quá trình đánh thủng không liên quan đến tổn thất trên điện môi.", "D": "Trị số điện áp xảy ra sự đánh thủng hoàn toàn không liên quan đến nhiệt độ."}, "ans": "D"}, {"id": 54, "num": 54, "q": "Thế nào là khả năng chịu nóng của vật liệu cách điện (VLCĐ)?", "opts": {"A": "Là nhiệt độ mà tại đó VLCĐ hay các chi tiết bị mất hoàn toàn các thuộc tính cách \n\nđiện.", "B": "Là nhiệt độ làm việc lớn nhất của VLCĐ và các chi tiết.", "C": "Là khả năng của VLCĐ và các chi tiết chịu đựng không bị hư hỏng trong thời gian \n\nngắn cũng như lâu dài dưới tác động của nhiệt độ cao và sự thay đổi đột ngột của nhiệt \nđộ.", "D": "Là khả năng của VLCĐ và các chi tiết chịu đựng không bị hư hỏng trong thời gian \n\ndài, dưới tác động của nhiệt độ cao."}, "ans": "C"}, {"id": 55, "num": 55, "q": "Theo quy định của IEC (Hội kỹ thuật điện quốc tế), dựa vào độ bền chịu nóng, \ncác vật liệu cách điện được phân thành các cấp sau:", "opts": {"A": "Nhiệt độ làm việc cao nhất cho phép của VLCĐ được giải quyết trên cơ sở nghiên \n\ncứu kỹ độ bền chịu nóng của vật liệu, không kể đến hệ số dự trữ.", "B": "Theo quy định của IEC (Hội kỹ thuật điện quốc tế), dựa vào độ bền chịu nóng, các \n\nvật liệu cách điện được phân thành 07 cấp cách nhiệt.", "C": "Thông thường, nhiệt độ làm việc của các thiết bị điện bị giới hạn bởi nhiệt độ làm \n\nviệc của vật liệu cách điện.", "D": "Các vật liệu thuần tuý hữu cơ chủ yếu thuộc cấp Y, A, E."}, "ans": "B"}, {"id": 56, "num": 57, "q": "Liệt kê các tính chất nhiệt quan trọng của điện môi nào dưới đây là ĐÚNG nhất \n\n?", "opts": {"A": "Khả năng chịu nhiệt, độ bền chịu nóng và nhiệt độ làm việc cho phép của điện môi.", "B": "Độ bền chịu nóng, độ bền chịu lạnh, độ dẫn nhiệt và giãn nở dài.", "C": "Nhiệt độ cháy và nhiệt độ chớp cháy, nhiệt độ đóng băng.", "D": "Nhiệt độ riêng, nhiệt dẫn suất (N), hệ số giãn nở dài của điện trở suất () và hệ số \n\ngiãn nở dài (l)."}, "ans": "B"}, {"id": 57, "num": 58, "q": "Hệ số dãn nở dài của vật liệu được định nghĩa:", "opts": {"A": "", "B": "", "C": "", "D": "(độ-1). \n\n(độ-1). \n\n(độ). \n\n(độ-1)."}, "ans": "A"}, {"id": 58, "num": 59, "q": "Thế nào là độ cứng của vật liệu?", "opts": {"A": "Là khả năng chống chịu va đập của vật liệu.", "B": "Là khả năng của vật liệu chống chịu không bị hư hỏng dưới tác dụng bất ngờ của các \nlực cơ học.", "C": "Là khả năng của vật liệu không bị hư hỏng dưới tác dụng của lực nén.", "D": "Là khả năng của bề mặt vật liệu chống lại biến dạng gây nên bởi lực nén truyền từ vật \n\ncó kính thước nhỏ."}, "ans": "D"}, {"id": 59, "num": 60, "q": "Độ nhớt là một đặc tính cơ học quan trọng của điện môi lỏng, theo anh (chị), \nđâu KHÔNG phải tên gọi của độ nhớt chất lỏng? \n\ndTdll1TKll==dTdlTKll==dTdll1TKll==dldTl1TKll==", "opts": {"A": "Độ nhớt ma sát.", "B": "Độ nhớt động lực học .", "C": "Độ nhớt động học .", "D": "Độ nhớt tương đối theo Angle."}, "ans": "A"}, {"id": 60, "num": 61, "q": "Khi duy trì nhiệt độ là hằng số, phát biểu nào dưới đây về độ ẩm tuyệt đối của \n\nkhông khí là ĐÚNG nhất ?", "opts": {"A": "Là tỉ số của V lít hơi nước chứa trong không khí và V lít không khí khảo sát.", "B": "Là thể tích (V lít) hơi nước chứa trong một đơn vị thể tích không khí (m3).", "C": "Là khối lượng (m gram) của hơi nước chứa trong một đơn vị thể tích không khí (m3).", "D": "Là phần trăm hơi nước chứa trong V lít không khí."}, "ans": "C"}, {"id": 61, "num": 62, "q": "Phát biểu nào về tính chịu nóng của điện môi dưới đây là KHÔNG chính xác?", "opts": {"A": "Khả năng chịu nóng của điện môi vô cơ xác định bởi nhiệt độ mà tại đó điện môi bắt \n\nđầu thay đổi mạnh các tính chất cơ học.", "B": "Khả năng chịu nóng là khả năn \n\ng vật liệu không bị hư hỏng dưới tác dụng của nhiệt độ cao, sự biến đổi đột ngột của \n\nnhiệt độ trong thời gian ngắn hoặc lâu dài.", "C": "Ở điện môi lỏng cháy được thì có nhiệt độ cháy cao hơn nhiệt độ chớp cháy.", "D": "Độ bền chịu nóng của vật liệu cách điện được đánh giá bằng các cấp cách điện."}, "ans": "A"}, {"id": 62, "num": 63, "q": "Theo quy định của IEC (Hội kỹ thuật điện quốc tế), các vật liệu cách điện được \n\nphân thành 7 cấp Y, A, E, B, F, H, C với nhiệt độ làm việc lớn nhất cho phép tương ứng \n\nlà:", "opts": {"A": "90oC, 105oC, 120oC, 130oC, 155oC, 180oC và >180oC", "B": "90oK, 105oK, 120oK, 130oK, 155oK, 180oK và >180oK.", "C": "90oC, 100oC, 120oC, 130oC, 150oC, 180oC và >180oC.", "D": "90oC, 105oC, 120oC, 135oC, 150oC, 165oC và ≥180oC."}, "ans": "A"}, {"id": 63, "num": 64, "q": "Theo anh (chị), đặc điểm nào sau đây KHÔNG phải là biểu hiện của sự già hoá \n\nđiện môi?", "opts": {"A": "Các thuộc tính cách điện bị giảm xấu ( tăng, Rcđ giảm, tg tăng và Eđt giảm.", "B": "Xuất hiện những vết nứt, cong vênh, biến màu.", "C": "Tăng điện áp phóng điện.", "D": "Khả năng chịu kéo, chịu uốn, chịu nén giảm..."}, "ans": "C"}, {"id": 64, "num": 65, "q": "Tốc độ già hoá của điện môi phụ thuộc vào nhiều yếu tố, theo anh (chị) nhận \n\nxét nào sau đây KHÔNG CHÍNH XÁC?", "opts": {"A": "Điện trường càng mạnh tốc độ già hoá càng nhanh.", "B": "Nhiệt độ càng cao tốc độ già hoá càng nhanh.", "C": "Độ ẩm không khí càng cao tốc độ già hoá càng nhanh.", "D": "Áp suất càng cao tốc độ già hoá càng nhanh."}, "ans": "D"}, {"id": 65, "num": 66, "q": "Theo anh (chị), đâu KHÔNG phải là lý do khiến chúng ta cần nghiên tính chất \n\nhoá học của điện môi.", "opts": {"A": "Trong quá trình làm việc không bị phân huỷ để giải thoát ra các sản phẩm phụ và \nkhông ăn mòn kim loại.", "B": "Quá trình làm việc vật liệu cách điện không được gây phản ứng hoá học với các vật \n\nliệu khác trong cùng kết cấu.", "C": "Trong quá trình làm việc các vật liệu thường xuyên gây phản ứng hoá học.", "D": "Khi sản xuất các chi tiết có thể gia công vật liệu bằng những phương pháp hoá công \n\nkhác nhau."}, "ans": "C"}, {"id": 66, "num": 67, "q": "Tại sao ta cần nghiên cứu tính chất cơ học của điện môi ?", "opts": {"A": "Vật liệu cách điện có độ bền cơ học rất kém.", "B": "Trong quá trình làm việc vật liệu cách điện thường xuyên phải chịu tác động của các \n\ntải trọng cơ học.", "C": "Vật liệu cách điện thường đóng vai trò nâng đỡ các chi tiết khác trong thiết bị điện.", "D": "Các chi tiết bằng vật liệu cách điện trong các thiết bị điện khi vận hành ngoài sự tác \n\nđộng của điện trường còn phải chịu tác động của các phụ tải cơ học."}, "ans": "D"}, {"id": 67, "num": 68, "q": "Theo anh (chị), đâu KHÔNG phải tính chất cơ học của điện môi rắn?", "opts": {"A": "Độ nhớt của vật liệu.", "B": "Độ bền chịu kéo, chịu nén, chịu uốn.", "C": "Tính giòn của vật liệu.", "D": "Độ cứng của vật liệu."}, "ans": "A"}, {"id": 68, "num": 69, "q": "Phát biểu nào dưới đây về ảnh hưởng của độ ẩm vật liệu đến các tính chất điện \n\ncủa VLCĐ là ĐÚNG nhất ?", "opts": {"A": "Làm tăng dòng điện rò và tổn thất điện môi, hằng số điện môi giảm và điện áp đánh \n\nthủng giảm.", "B": "Làm tăng dòng điện rò và tổn thất điện môi, hằng số điện môi tăng và điện áp đánh \nthủng giảm.", "C": "Làm tăng dòng điện rò và tổn thất điện môi, hằng số điện môi giảm, điện áp phóng \n\nđiện bề mặt và điện áp đánh thủng giảm.", "D": "Làm tăng dòng điện rò và tổn thất điện môi, hằng số điện môi tăng và điện áp phóng \n\nđiện bề mặt tăng."}, "ans": "B"}, {"id": 69, "num": 70, "q": "Việc sử dụng vật liệu cách điện chịu nóng cao hơn trong thiết bị điện sẽ:", "opts": {"A": "Nâng cao được công suất của thiết bị nhưng phải tăng trọng lượng và kích thước của \n\nthiết bị để đảm bảo điều kiện làm mát.", "B": "Nâng  cao  được  công  suất  của  thiết  bị  mà  vẫn  giữ  nguyên  được  kích  thước,  trọng \nlượng. Nhưng làm giảm tuổi thọ của thiết bị.", "C": "Nâng  cao  được  công  suất  của  thiết  bị  mà  vẫn  giữ  nguyên  được  kích  thước,  trọng \n\nlượng. Vẫn đảm bảo tuổi thọ theo yêu cầu.", "D": "Làm tăng tổn hao trong máy, giảm hiệu suất khi làm việc và làm giảm tuổi thọ của \n\nthiết bị"}, "ans": "C"}, {"id": 70, "num": 71, "q": "Theo anh (chị), đặc điểm nào sau đây của tính chịu tác động của bức xạ năng \n\nlượng cao của VLCĐ là KHÔNG chính xác?", "opts": {"A": "Bức xạ năng lượng cao có thể sử dụng trong quá trình công nghệ để tạo ra vật liệu \n\nmới có những tính chất quý giá đối với thực tế.", "B": "Khi gặp bề mặt vật liệu, năng lượng phóng xạ giảm theo mức độ thấm vào chiều sâu \n\ncủa vật liệu.", "C": "Tác động của bức xạ có thể dẫn đến hàng loạt các biến đổi phân tử và phản ứng hoá \n\nhọc.", "D": "Sự hấp thụ phóng xạ trong vật liệu không phụ thuộc vào bản chất vật liệu và dạng \n\nphóng xạ."}, "ans": "D"}, {"id": 71, "num": 72, "q": "Độ bền bức xạ của vật liệu cách điện là", "opts": {"A": "Mức độ bền vững của vật liệu đối với tác động của bức xạ, mức độ duy trì tính chất \n\nđiện và cơ của chúng.", "B": "Mức độ bền vững của vật liệu đối với tác động của một số loại bức xạ yếu, mức độ \nduy trì tính chất điện của chúng.", "C": "Mức độ bền vững của vật liệu đối với tác động của một số loại bức xạ yếu, mức độ \n\nduy trì tính chất cơ của chúng.", "D": "Mức độ bền vững của vật liệu đối với tác động của một số loại bức xạ mạnh, mức độ \nduy trì tính chất điện và cơ của chúng."}, "ans": "A"}, {"id": 72, "num": 73, "q": "Nhận xét nào dưới đây về độ ẩm vật liệu là KHÔNG chính xác ?", "opts": {"A": "Việc xác định độ ẩm của vật liệu cách điện rất quan trọng để chọn những điều kiện \nthử nghiệm các tính chất điện của vật liệu", "B": "Độ hút ẩm của vật liệu hoàn toàn phản ánh mức độ biến đổi tính chất điện của vật liệu \n\ncách điện khi bị ẩm", "C": "Các vật liệu cách điện với mức độ nhiều hay ít đều hút ẩm", "D": "Nếu hơi ẩm phân bố theo thể tích của vật liệu một cách rời rạc, không liên hệ gì với \n\nnhau thì ảnh hưởng của hơi ẩm đến tính chất điện của vật liệu ít hơn."}, "ans": "B"}, {"id": 73, "num": 74, "q": "Liệt kê  các tính chất của tính hút ẩm của vật liệu cách điện nào dưới đây là \nĐÚNG nhất", "opts": {"A": "Độ ẩm của vật liệu, tính hút ẩm, tính thấm ẩm, sự hấp phụ hơi nước trên bề mặt điện \n\nmôi.", "B": "Độ ẩm của vật liệu, tính hút ẩm, sự hấp phụ hơi nước vào trong điện môi.", "C": "Độ ẩm của vật liệu, tính thấm ẩm, sự hấp phụ hơi nước trên bề mặt điện môi.", "D": "Tính hút ẩm, tính thấm ẩm, sự hấp phụ hơi nước vào trong điện môi."}, "ans": "A"}, {"id": 74, "num": 75, "q": "Trong các phát biểu sau về vật liệu cách điện phát biểu nào là chưa chính \n\nxác?", "opts": {"A": "Vật liệu không cho dòng điện chạy qua.", "B": "Không dùng làm điện môi công tác trong các tụ điện.", "C": "Chỉ cho dòng điện đi theo những con đường trong mạch điện đã được sơ đồ qui \n\nđịnh.", "D": "Không có vật liệu cách điện thì sẽ không chế tạo được bất kỳ một loại thiết bị nào"}, "ans": "B"}, {"id": 75, "num": 76, "q": "Trong các phát biểu sau về cách điện phát biểu nào là chính xác nhất:", "opts": {"A": "Có độ bền điện tốt.", "B": "Có khả năng chịu nhiệt cao.", "C": "Có khả năng thỏa mãn tốt nhất về các đặc tính điện, các đặc tính về cơ - lý – hóa và \n\nkhả năng đáp ứng được các điều kiện làm việc của môi trường.", "D": "Có độ bền điện tốt, có khả năng chịu nhiệt cao và đáp ứng được các điều kiện làm \nviệc của môi trường."}, "ans": "C"}, {"id": 76, "num": 77, "q": "Phân loại vật liệu cách điện theo trạng thái đáp án nào là chính xác:", "opts": {"A": "Khí, lỏng, rắn.", "B": "Khí, lỏng, rắn và vật liệu hóa rắn.", "C": "Khí, lỏng, rắn, đặc.", "D": "Khí, lỏng, hóa rắn và kết dính."}, "ans": "B"}, {"id": 77, "num": 78, "q": "Phân loại vật liệu cách điện theo bản chất hóa họa cách nào sau đây là chính \nxác nhất:", "opts": {"A": "Vật liệu cách điện vô cơ, hữu cơ.", "B": "Vật liệu cách điện vô cơ, hữu cơ, vật liệu có tính trung gian giữa hữu cơ và vô cơ.", "C": "Vật liệu cách điện vô cơ, hữu cơ, vật liệu cao phân tử.", "D": "Vật liệu cách điện vô cơ, hữu cơ, vật liệu hóa rắn."}, "ans": "B"}, {"id": 78, "num": 79, "q": "Trong các chất khí sau chất khí nào có độ biền điện cao nhất?", "opts": {"A": "C2F6", "B": "N2", "C": "SF6", "D": "CF4"}, "ans": "C"}, {"id": 79, "num": 80, "q": "Sản phẩm của dầu mỏ cách điện được sử dụng trong kỹ thuật điện gồm những \n\nloại nào?", "opts": {"A": "Dầu biến áp, dầu xôvôn, dầu trẩu.", "B": "Dầu tụ điện, dầu cáp, dầu xôvôn.", "C": "Dầu cáp, dầu trẩu, dầu biến áp.", "D": "Dầu biến áp, dầu tụ điện, dầu cáp điện."}, "ans": "D"}, {"id": 80, "num": 81, "q": "Trong các phát biểu sau về công dụng của dầu biến áp phát biểu nào là chưa \n\nchính xác?", "opts": {"A": "Tăng cường sự thoát nhiệt trong máy biến áp", "B": "Dùng làm chất cách điện trong các máy cắt dầu.", "C": "Tăng cường độ bền điện trong máy biến áp.", "D": "Giảm tổn hao công suất trong máy biến áp."}, "ans": "D"}, {"id": 81, "num": 82, "q": "Loại sơn dùng cho những vật liệu cách điện xốp đặc biệt cách điện ở dạng xơ \n\n(giấy, bìa, vải sợi..) là:", "opts": {"A": "Sơn tẩm", "B": "Sơn phủ", "C": "Sơn dán", "D": "Sơn dầu"}, "ans": "A"}, {"id": 82, "num": 83, "q": "Mục đích của việc tẩm, sấy cách điện:", "opts": {"A": "Nhằm nâng cao tính cách điện, khả năng tỏa nhiệt, tính chịu ẩm và độ bền cơ học \n\ncho sản phẩm, tạo ra trên bề mặt lớp cách điện bóng và đẹp.", "B": "Nhằm tạo ra trên bề mặt lớp cách điện và trong thiết bị một lớp cách điện tốt hơn \nnhằm tăng tuổi thọ của các thiết bị điện.", "C": "Nhằm nâng cao tính cách điện, khả năng tỏa nhiệt, tính chịu ẩm và độ bền cơ học \n\ncho sản phẩm, tạo ra trên bề mặt lớp cách điện bóng và đẹp, hơn nữa nâng cao điện áp \nphóng điện bề mặt cho sản phẩm.", "D": "Nhằm nâng cao tính cách điện, độ bền cơ học cho sản phẩm, nâng cao điện áp \n\nphóng điện bề mặt cho sản phẩm."}, "ans": "B"}, {"id": 83, "num": 84, "q": "Trong các phát biểu về quy trình tẩm và sấy sơn cách điện cho thiết bị điện \n\nphát biểu nào là chưa chính xác?", "opts": {"A": "Sau khi sơn tẩm cũng cần sấy khô để loại bỏ dung môi.", "B": "Sơn nhiệt cứng thì cần nhiệt luyện để làm rắn màng sơn", "C": "Quá trình tẩm – sấy tiến hành một lần.", "D": "Cần phải sấy khô cách điện trước khi sơn tẩm."}, "ans": "C"}, {"id": 84, "num": 85, "q": "Có thể phân loại sơn cách điện thành những loại nào?", "opts": {"A": "Theo cách sử dụng sơn có thể chia thành 3 nhóm chính: sơn tẩm, sơn phủ, sơn dầu; \n\ntheo chế độ sấy sơn được chia thành  loại: sơn sấy nóng, sơn sấy nguội và sơn tự khô.", "B": "Theo cách sử dụng sơn có thể chia thành 3 nhóm chính: sơn tẩm, sơn phủ, sơn dán; \n\ntheo chế độ sấy sơn được chia thành 2 loại: sơn sấy nóng và sơn sấy nguội.", "C": "Theo cách sử dụng sơn có thể chia thành 3 nhóm chính: sơn tẩm, sơn phủ, sơn \n\nchống ẩm; theo chế độ sấy sơn được chia thành 2 loại: sơn sấy nóng và sơn sấy nguội.", "D": "Theo cách sử dụng sơn có thể chia thành 3 nhóm chính: sơn tẩm, sơn dán, sơn dầu; \n\ntheo chế độ sấy sơn được chia thành 2 loại: sơn sấy nóng và sơn sấy nguội."}, "ans": "B"}, {"id": 85, "num": 86, "q": "Dựa theo cách sử dụng, sơn cách điện có thể chia thành các nhóm chính:", "opts": {"A": "Sơn phủ, sơn nhựa, sơn dầu.", "B": "Sơn dán, sơn phủ và sơn tẩm.", "C": "Sơn dầu, sơn dán, sơn tẩm.", "D": "Sơn phủ, sơn dầu, sơn dán."}, "ans": "B"}, {"id": 86, "num": 87, "q": "Các cách phân loại vật liệu cách điện hữu cơ?", "opts": {"A": "Theo nguồn gốc: tự nhiên, nhân tạo, tổng hợp; theo cấu trúc phân tử: pôlime đường \nthẳng, pôlime không gian;", "B": "Theo nguồn gốc: tự nhiên, nhân tạo, tổng hợp; theo cấu trúc phân tử: pôlime đường \nthẳng, pôlime không gian; theo tính chất nhiệt: nhiệt dẻo, nhiệt cứng.", "C": "Theo nguồn gốc: tự nhiên, nhân tạo, tổng hợp; theo cấu trúc phân tử: pôlime đường \nthẳng, pôlime không gian; theo tính phân cực: phân tử trung hòa, phân tử cực tính.", "D": "Theo nguồn gốc: tự nhiên, nhân tạo, tổng hợp; theo cấu trúc phân tử: pôlime đường \n\nthẳng, pôlime không gian; theo tính chất nhiệt: nhiệt dẻo, nhiệt cứng; theo mức độ tổn \n\nhao: vật liệu có tổn hao bé (phân tử trung hòa), vật liệu có tổn hao lớn ( phân tử cực \n\ntính)."}, "ans": "D"}, {"id": 87, "num": 88, "q": "Trong các phát biểu sau về nhựa cách điện trong kỹ thuật điện phát biểu nào \n\nlà không chính xác?", "opts": {"A": "Nhựa là thành phần cấu tạo quan trọng nhất của nhiều loại sơn, các chất dẻo, các \n\nvật liệu xơ nhân tạo và xơ tổng hợp.", "B": "Nhựa là hỗn hợp của các chất vô cơ, chủ yếu là những chất cao phân tử với mức độ \n\ntrùng hợp khác nhau", "C": "Nhựa có tính kết dính.", "D": "Nhựa không tan trong nước nhưng tan được trong các dung môi hữu cơ thích hợp."}, "ans": "B"}, {"id": 88, "num": 89, "q": "Vật liệu cách điện xơ có ưu điểm gì?", "opts": {"A": "độ bền cơ và độ dẻo khá cao, sản xuất thuận tiện.", "B": "độ bền cơ khá cao, độ bền điện cao, chịu ẩm.", "C": "độ bền cơ khá cao, chịu nhiệt, sản xuất thuận tiện.", "D": "độ bền cơ khá cao, cách điện rất tốt, chịu ẩm, chịu nhiệt."}, "ans": "A"}, {"id": 89, "num": 90, "q": "Hãy kể tên các vật liệu xơ được dùng trong kỹ thuật điện ?", "opts": {"A": "gỗ, giấy và các tông, các vật liệu dệt, vải lụa và sơn cách điện.", "B": "gỗ, giấy và các tông, màng mỏng, vải và lụa cách điện.", "C": "gỗ, giấy và các tông, màng mỏng, chất dẻo có chất độn, vải và lụa sơn cách điện.", "D": "gỗ, giấy và các tông, cao su, băng vải bằng thủy tinh"}, "ans": "C"}, {"id": 90, "num": 91, "q": "Trong các phát biểu sau về đặc tính của đa số điện môi vô cơ phát biểu nào \n\nchưa chính xác?", "opts": {"A": "tính chịu nhiệt cao, hoàn toàn không hút ẩm, độ bền điện cao và ổn định.", "B": "tính chịu nhiệt cao, không hút ẩm, độ bền cơ cao, chịu kéo tốt.", "C": "tính chịu nhiệt cao, ít hút ẩm, độ bền điện cao và ổn định.", "D": "tính chịu nhiệt cao, hầu như không hút ẩm, độ bền cơ cao, chịu kéo tốt."}, "ans": "B"}, {"id": 91, "num": 92, "q": "Trong các phát biểu sau về sứ cách điện phát biểu nào là không chính xác?", "opts": {"A": "Sứ được chế tạo từ cao lanh với khoáng thạch anh và fenspat.", "B": "Sứ có chiều dày lớn thì độ bề cơ điện tăng lên.", "C": "Sứ có hằng số điện môi cao.", "D": "Với sứ cách điện độ bền cơ khi chịu nén trội hơn độ bền khi chịu kéo."}, "ans": "B"}, {"id": 92, "num": 93, "q": "Trong các loại nhựa dưới đây loại nhựa nào có tính chất cách điện như sau: là \n\nmột loại nhựa tự nhiên  =1014 1015.cm; E®t= 1015 KV/mm,  và tg phụ thuộc \nnhiệt độ.", "opts": {"A": "Nhựa cao su tự nhiên", "B": "Nhựa đường", "C": "Nhựa cánh kiến", "D": "Nhựa thông"}, "ans": "D"}, {"id": 93, "num": 94, "q": "Để sản xuất cao su tổng hợp người ta dùng:", "opts": {"A": "Rượu cồn, dầu mỏ và khí thiên nhiên làm nguyên liệu.", "B": "Rượu cồn , Cao su lưu hóa làm nguyên liệu.", "C": "Rượu cồn, dầu mỏ, Cao su thiên nhiên làm nguyên liệu.", "D": "Cao su thiên nhiên và Cao su lưu hóa làm nguyên liệu."}, "ans": "A"}, {"id": 94, "num": 95, "q": "Thủy tinh SiO2 dùng trong cách điện là chất vô cơ.", "opts": {"A": "không định hình", "B": "có định hình", "C": "định hình luôn thay đổi", "D": "không xác định được"}, "ans": "A"}, {"id": 95, "num": 96, "q": "Trong phát biểu sau về hợp chất cách điện bằng Bitum phát biểu nào là không \n\nchính xác:", "opts": {"A": "Hợp chất làm đầy trong mối nối", "B": "Tẩm dây quấn stato của máy điện", "C": "Tẩm dây quấn rôto của máy điện", "D": "Tẩm dây quấn máy biến áp khô"}, "ans": "C"}, {"id": 96, "num": 97, "q": "Phíp cách điện được chế tạo từ một loại vật liệu đem ngâm trong dung dịch \n\nclorua kẽm nóng rồi ép trải qua quá trình gia công, vật liệu đó là:", "opts": {"A": "Gỗ", "B": "Tre", "C": "Giấy", "D": "Sợi amiăng"}, "ans": "C"}, {"id": 97, "num": 98, "q": "Loại nhựa chịu được cách điện cấp C >1800C trong các loại nhựa dưới đây", "opts": {"A": "Nhựa polyetylen (PE)", "B": "Nhựa polypropylen (PP)", "C": "Nhựa Polyizobutylen (PI)", "D": "Nhựa Polytetrafloetylen"}, "ans": "D"}, {"id": 98, "num": 99, "q": "Trong các loại nhựa dưới đây tính chịu  nhiệt của loại nhựa nào là thấp nhất:", "opts": {"A": "Nhựa polyetylen (PE)", "B": "Nhựa polypropylen (PP)", "C": "Nhựa Polyizobutylen (PI)", "D": "Nhựa Polystyrol(PS)"}, "ans": "C"}, {"id": 99, "num": 100, "q": "Cách điện làm việc trong hệ thống phải chịu các loại điện áp nào:", "opts": {"A": "Điện áp làm việc, điện áp thử nghiệm, quá điện thế nội bộ, quá điện thế khí quyển", "B": "Điện áp làm việc, điện áp thử nghiệm, quá điện thế nội bộ, điện áp đánh thủng", "C": "Điện áp làm việc, điện áp thử nghiệm, điện áp đánh thủng, quá điện thế khí quyển", "D": "Điện áp làm việc, điện áp đánh thủng, quá điện thế nội bộ, quá điện thế khí quyển"}, "ans": "A"}, {"id": 100, "num": 101, "q": "Trong các phát biểu dưới đây về yêu cầu của cách điện đường dây trên \n\nkhông phát biểu nào là chưa chính xác:", "opts": {"A": "Các dây dẫn của đường dây trên không phải cách điện với nhau và cách điện đối \n\nvới đất", "B": "Cách điện của đường dây phải chịu được tác dụng của tất cả các loại quá điện áp \n\nnội bộ và quá điện áp khí quyển.", "C": "để tăng cường cách điện có thể dùng thêm các thiết bị tự động như cuộn dập hồ \n\nquang, thiết bị tự động đóng lại.", "D": "Phóng điện trên đường dây thường xảy ra men theo bề mặt cách điện hoặc là chọc \n\nthủng cách điện khí giữa dây dẫn và bộ phận kim loại cột."}, "ans": "B"}, {"id": 101, "num": 102, "q": "Trong các phát biểu dưới đây về thí nghiệm độ bền cơ phát biểu nào là chưa \n\nchính xác về tải trọng thí nghiệm 1 giờ:", "opts": {"A": "Cách điện phải chịu được trọng tải bằng 85% độ bền cơ điện", "B": "Cách điện phải chịu được trọng tải bằng 75% độ bền cơ điện", "C": "Cách điện phải chịu được trọng tải bằng 50% độ bền cơ điện", "D": "Cách điện phải chịu được trọng tải bằng độ bền cơ điện"}, "ans": "B"}, {"id": 102, "num": 103, "q": "Trong các phát biểu dưới đây phát biểu nào là chưa chính xác về đặc tính \nvôn-giây:", "opts": {"A": "Chọn cách điện theo quá điện áp khí quyển", "B": "Chọn cách điện theo quá điện áp phóng điện ướt", "C": "Chọn cách điện theo quá điện áp phóng điện khô", "D": "Chọn cách điện theo quá điện áp phóng điện tần số công nghiệp"}, "ans": "B"}, {"id": 103, "num": 104, "q": "Kiểm tra dự phòng cách điện là…", "opts": {"A": "Một hệ thống thí nghiệm điện để phán đoán tình hình cách điện, đảm bảo vận hành \n\nan toàn", "B": "Đo tổn hao tg vì nó là chỉ tiêu phẩm chất của điện môi", "C": "Các thí nghiệm về phân bố điện áp, phóng điện cục bộ và thí nghiệm điện áp tăng \n\ncao.", "D": "Các thí nghiệm đo tổn hao điện môi, trị số điện dung, trị số dòng điện."}, "ans": "A"}, {"id": 104, "num": 105, "q": "Trong thí nghiệm đo điện dung theo nhiệt độ trong các kết cấu cách điện \n\ntương đối đồng nhất (tìm đáp án đúng):", "opts": {"A": "nếu C70/C20>1,3 thì cách điện phải đem sấy.", "B": "nếu C20/C70>1,3 thì cách điện phải đem sấy.", "C": "nếu C70/C50>1,3 thì cách điện phải đem sấy.", "D": "nếu C50/C70>1,3 thì cách điện phải đem sấy."}, "ans": "A"}, {"id": 105, "num": 106, "q": "Trong thí nghiệm đo điện dung theo tần số trong các kết cấu cách điện tương \n\nđối đồng nhất (tìm đáp án đúng):", "opts": {"A": "Khi tỷ số C50/C2>1,3 thì cách điện phải đem sấy.", "B": "Khi tỷ số C2/C50>1,3 thì cách điện phải đem sấy.", "C": "Khi tỷ số C20/C50>1,3 thì cách điện phải đem sấy.", "D": "Khi tỷ số C50/C20>1,3 thì cách điện phải đem sấy."}, "ans": "B"}, {"id": 106, "num": 107, "q": "Hình vẽ sau sử dụng trong thí nghiệm…", "opts": {"A": "Đo dòng điện mạch ngoài", "B": "Đo sự phân bố điện áp", "C": "Đo dòng điện rò", "D": "Đo điện trở cách điện"}, "ans": "B"}, {"id": 107, "num": 108, "q": "Chọn phương án đúng trong các phát biểu sau về thứ tự sắp xếp độ bền cách \nđiện trong hệ thống cách điện:", "opts": {"A": "Mức dưới, mức giữa, mức trên. \n\n C 3 2 1", "B": "Mức dưới, mức giữa, mức cao.", "C": "Mức cao, mức giữa, mức thấp.", "D": "Mức cao, mức trung bình, mức thấp."}, "ans": "A"}, {"id": 108, "num": 109, "q": "Trong phát biểu về phối hợp các mức cách điện: Mức dưới trong hệ thống \n\ncách điện là:", "opts": {"A": "điện áp kích thích và điện áp dư của thiết bị bảo vệ quá điện thế.", "B": "điện áp làm phóng điện khoảng cách phóng điện (trên sứ đỡ, sứ xuyên) hoặc điện \náp làm phóng điện bộ phóng điện", "C": "điện áp đánh thủng cách điện của thiết bị điện (máy biến thế, máy biến thế đo \n\nlường…)", "D": "điện áp làm phóng điện bộ phóng điện"}, "ans": "A"}, {"id": 109, "num": 110, "q": "Trong phát biểu về phối hợp các mức cách điện: Mức giữa trong hệ thống \n\ncách điện là:", "opts": {"A": "điện áp làm phóng điện khoảng cách phóng điện (trên sứ đỡ, sứ xuyên) hoặc điện \n\náp làm phóng điện bộ phóng điện", "B": "điện áp kích thích và điện áp dư của thiết bị bảo vệ quá điện thế.", "C": "điện áp dư của thiết bị bảo vệ quá điện thế.", "D": "điện áp đánh thủng cách điện của thiết bị điện (máy biến thế, máy biến thế đo \n\nlường…)"}, "ans": "A"}, {"id": 110, "num": 111, "q": "Trong phát biểu về phối hợp các mức cách điện: Mức trên trong hệ thống \n\ncách điện là:", "opts": {"A": "điện áp làm phóng điện khoảng cách phóng điện (trên sứ đỡ, sứ xuyên) hoặc điện \n\náp làm phóng điện bộ phóng điện", "B": "điện áp kích thích và điện áp dư của thiết bị bảo vệ quá điện thế.", "C": "điện áp dư của thiết bị bảo vệ quá điện thế.", "D": "điện áp đánh thủng cách điện của thiết bị điện (máy biến thế, máy biến thế đo \n\nlường…)"}, "ans": "D"}, {"id": 111, "num": 112, "q": "Trong phát biểu sau về thiết kế cách điện cho hệ thống điện phát biểu nào \nchưa chính xác:", "opts": {"A": "Thiết kế cách điện cho 1 thiết bị, ta cần tính với tất cả điện áp có tác dụng trên thiết \nbị.", "B": "Thiết kế cách điện với độ bền cách điện từ nhỏ đến lớn, sắp xếp theo bậc thang và \nphối hợp các mức cách điện với nhau.", "C": "Trong hệ thống cách điện ta cố gắng bảo vệ cách điện bên trong của thiết bị bằng \n\ncách tạo ra những chỗ yếu cách điện hơn trong hệ thống.", "D": "Thiết kế cách điện sao cho thiết bị có thể chịu được quá điện thế có trị số bất kỳ"}, "ans": "D"}, {"id": 112, "num": 113, "q": "Có thể phát hiện phóng điện cục bộ trong điện môi bằng các phương pháp \n\nsau:", "opts": {"A": "Đo điện áp trên cách điện.", "B": "Đo sự phân bố điện áp.", "C": "Đo điện áp xung kích.", "D": "Đo điện áp phản hồi."}, "ans": "A"}, {"id": 113, "num": 114, "q": "Để phát hiện phóng điện cục bộ trong điện môi phương pháp nào trong các \nphương pháp sau là chưa chính xác", "opts": {"A": "Đo điện áp trên cách điện", "B": "Đo dòng điện trong mạch ngoài", "C": "Đo cường độ sóng điện từ do phóng điện cục bộ phát ra trong không gian", "D": "Đo điện áp sóng phản hồi"}, "ans": "D"}, {"id": 114, "num": 115, "q": "Theo lý thuyết phân vùng năng lượng trong vật rắn vật liệu được phân thành \n\ncác loại sau:", "opts": {"A": "Điện môi, bán dẫn và vật dẫn.", "B": "Kim loại, phi kim và bán dẫn.", "C": "Chất nghịch từ, chất thuận từ và chất dẫn từ.", "D": "Chất khí, chất lỏng và chất rắn."}, "ans": "A"}, {"id": 115, "num": 116, "q": "Theo từ tính vật liệu được phân thành các loại sau:", "opts": {"A": "Điện môi, bán dẫn và vật dẫn.", "B": "Chất nghịch từ, chất thuận từ và chất dẫn từ.", "C": "Vật liệu từ mềm, vật liệu từ cứng và vật liệu từ có công dụng đặc biệt.", "D": "Vật liệu dẫn điện, vật liệu cách điện, vật liệu dẫn từ và vật liệu bán dẫn."}, "ans": "B"}, {"id": 116, "num": 117, "q": "Đặc điểm nào của phân tử trung hoà dưới đây là không đúng?", "opts": {"A": "Ở điều kiện bình thường, trọng tâm điện tích dương của các hạt nhân và trọng tâm \n\nđiện tích âm của đám mây điện tử trùng nhau.", "B": "Ở điều kiện bình thường, trọng tâm điện tích dương của các hạt nhân và trọng tâm \nđiện tích âm của đám mây điện tử không trùng nhau.", "C": "Có cấu trúc đối xứng, tạo thành từ liên kết cộng hoá trị.", "D": "Phân tử trung hoà có mômen điện M = 0."}, "ans": "B"}, {"id": 117, "num": 118, "q": "Đặc điểm nào của phân tử lưỡng cực (cực tính) dưới đây là không đúng?", "opts": {"A": "Phân tử cực tính có mômen điện M = Q.l.", "B": "Có cấu trúc không đối xứng, tạo thành từ liên kết cộng hoá trị.", "C": "Ở điều kiện bình thường, trọng tâm điện tích dương của các hạt nhân và các đám mây \nđiện tử trùng nhau.", "D": "Ở điều kiện bình thường, phân tử cực tính có trọng tâm điện tích dương của các hạt \n\nnhân và trong tâm điện tích âm của mây điện tử không trùng nhau, chúng cách nhau một \nkhoảng cách l nào đó."}, "ans": "C"}, {"id": 118, "num": 119, "q": "Trong các nhân xét sau, nhận xét nào là không chính xác?", "opts": {"A": "Những chất được cấu tạo bằng các phân tử trung hoà gọi là chất trung hoà.", "B": "Những chất ở điều kiện bình thường trung hoà về điện được gọi là chất trung hoà.", "C": "Chất được cấu tạo bằng các phân tử cực tính gọi là chất cực tính.", "D": "Có thể dựa vào trị số của mô men lưỡng cực (m=q.l) để đánh giá chất cực tính mạnh \n\nhay yếu."}, "ans": "B"}, {"id": 119, "num": 120, "q": "Khi đặt điện môi vào trong điện trường có thể có: (tìm đáp án sai)", "opts": {"A": "Hiện tượng dẫn điện và phân cực điện môi.", "B": "Hiện tượng dịch chuyển của các điện tích liên kết theo cùng 1 hướng.", "C": "Hiện tượng dịch chuyển của các điện tích tự do.", "D": "Hiện tượng vật liệu mất tính chất cách điện."}, "ans": "D"}, {"id": 120, "num": 121, "q": "Phân cực điện môi là gì?", "opts": {"A": "Là sự xoay hướng của các phân tử lưỡng cực dưới tác dụng của điện trường ngoài.", "B": "Là sự chuyển dịch đàn hồi của lớp vỏ điện tử của nguyên tử hoặc ion dưới tác dụng \n\ncủa điện trường ngoài.", "C": "Là sự phân chia các chất điện môi tạo thành các cực tính khác nhau.", "D": "Là sự dịch chuyển có giới hạn của các điện tích liên kết và sự định hướng 1 phần của \n\ncác phân tử lưỡng cực dưới tác dụng của điện trường."}, "ans": "D"}, {"id": 121, "num": 122, "q": "Có thể đánh giá hiện tượng phân cực điện môi bằng:", "opts": {"A": "Hằng số điện môi  và góc tổn thất điện môi .", "B": "Hằng số điện môi  và dòng điện rò.", "C": "Góc tổn thất điện môi  và dòng phân cực.", "D": "Dòng điện rò và dòng phân cực."}, "ans": "A"}, {"id": 122, "num": 123, "q": "Để đánh giá mức độ phân cực của điện môi người ta đưa ra khái niệm hằng số \nđiện môi tương đối:", "opts": {"A": "", "B": "", "C": "", "D": ". \n\n. \n\n. \n\n."}, "ans": "B"}, {"id": 123, "num": 124, "q": "Phát biểu nào sau đây về hằng số điện môi tuyệt đối là không chính xác?", "opts": {"A": "Hằng số điện môi là tham số được dùng để đánh giá mức độ phân cực của điện môi.", "B": "Hằng số điện môi là tham số có có đơn vị cụ thể.", "C": "Hằng số điện môi được dùng để đặc trưng cho điện môi.", "D": "Các điện môi khác nhau thì có hằng số điện môi khác nhau."}, "ans": "B"}, {"id": 124, "num": 125, "q": "Phát biểu nào sau đây về hiện tượng phân cực là không đúng?", "opts": {"A": "Quá trình phân cực xảy ra trong điện môi phụ thuộc vào điện trường tác động.", "B": "Dưới tác dụng của điện trường ngoài, các điện tích liên kết của điện môi dịch chuyển \n\nvề phía các điện cực cùng chiều hoặc ngược chiều tùy theo dấu của chúng.", "C": "Khi điện môi được đặt giữa 2 điện cực và nối vào mạch điện thì có thể xem như 1 tụ \n\nđiện.", "D": "Trong quá trình phân cực khi điện trường giảm sự phân cực giảm dần cho đến khi \n\nđiện trường ngoài bằng không thì các điện tích trở về trạng thái ban đầu."}, "ans": "B"}, {"id": 125, "num": 126, "q": "Phát biểu nào sau đây về phân cực nhanh (tức thời) là không chính xác?", "opts": {"A": "Phân cực nhanh xảy ra tức thời, đàn hồi hoàn toàn.", "B": "Quá trình phân cực nhanh không gây phát tán năng lượng.", "C": "Trên sơ đồ thay thế, các hiện tượng phân cực nhanh được biểu diễn bằng một tụ điện.", "D": "Sau khi hết phân cực các điện tích không thể trở về được trạng thái ban đầu."}, "ans": "D"}, {"id": 126, "num": 127, "q": "Phát biểu nào sau đây về phân cực chậm là không chính xác?", "opts": {"A": "Phân cực chậm xảy ra không tức thời.", "B": "Quá trình phân cực gây phát tán năng lượng.", "C": "Trên sơ đồ thay thế, các hiện tượng phân cực chậm được biểu diễn bằng một tụ điện \nnối tiếp với 1 điện trở.", "D": "Sự phân cực chậm chỉ có ở một số loại điện môi và không liên quan đến tổn thất năng"}, "ans": "D"}, {"id": 127, "num": 128, "q": "Hiện tượng phân cực nào luôn xuất hiện ở điện môi không đồng nhất, điện môi \n\nnhiều lớp?  \n\n0000Q'Q1Q'QQQQ−=−==0000Q'Q1Q'QQQQ+=+==0000Q'Q1'QQQQQ−=+=='1'0000QQQQQQQ+=+==", "opts": {"A": "Phân cực điện tử nhanh, phân cực ion nhanh.", "B": "Phân cực kết cấu, phân cực điện tử nhanh.", "C": "Phân cực ion chậm và phân cực lưỡng cực chậm.", "D": "Phân cực kết cấu và phân cực tự phát."}, "ans": "B"}, {"id": 128, "num": 129, "q": "(Tìm phương án sai) Đặc điểm của phân cực tự phát là:", "opts": {"A": "Hiện tượng phân cực xảy ra ngay cả khi không có điện trường ngoài E = 0.", "B": "Khi có điện trường ngoài tác động thì các mô men điện xoay theo hướng điện trường \n\nngoài gây ra hiệu ứng phân cực rất mạnh.", "C": "Đến 1 trị số nào đó của điện trường ngoài sẽ xuất hiện hiện tượng phân cực bão hoà.", "D": "Hiện tượng phân cực chỉ xảy ra khi có điện trường ngoài E   0."}, "ans": "D"}, {"id": 129, "num": 130, "q": "Cho sơ đồ đẳng trị tổng quát như hình vẽ, anh (chị) hãy chỉ ra sơ đồ thay thế \n\ncủa điện môi khí trung tính gồm các nhánh:", "opts": {"A": "Sơ đồ thay thế gồm nhánh 1, 3, 4, 5, 9.", "B": "Sơ đồ thay thế gồm nhánh 1, 2, 3, 9.", "C": "Sơ đồ thay thế gồm nhánh 1, 3, 9.", "D": "Sơ đồ thay thế gồm nhánh 1, 3, 4, 9."}, "ans": "C"}, {"id": 130, "num": 131, "q": "Cho sơ đồ đẳng trị tổng quát như hình vẽ, anh (chị) hãy chỉ ra sơ đồ thay thế \n\ncủa điện môi lỏng cực tính (lưỡng cực) gồm các nhánh:", "opts": {"A": "Sơ đồ thay thế gồm nhánh 1, 3, 4, 5, 9.", "B": "Sơ đồ thay thế gồm nhánh 1, 2, 3, 9.", "C": "Sơ đồ thay thế gồm nhánh 1, 3, 9.", "D": "Sơ đồ thay thế gồm nhánh 1, 3, 4, 9."}, "ans": "D"}, {"id": 131, "num": 132, "q": "Cho sơ đồ đẳng trị tổng quát như hình vẽ, anh (chị) hãy chỉ ra sơ đồ thay thế \n\ncủa điện môi rắn cấu tạo ion có mối liên kết ràng buộc giữa các ion chặt chẽ, gồm các \nnhánh:", "opts": {"A": "Sơ đồ thay thế gồm nhánh 1, 3, 4, 5, 9.", "B": "Sơ đồ thay thế gồm nhánh 1, 2, 3, 9.", "C": "Sơ đồ thay thế gồm nhánh 1, 3, 9.", "D": "Sơ đồ thay thế gồm nhánh 1, 3, 4, 9."}, "ans": "B"}, {"id": 132, "num": 133, "q": "Cho sơ đồ đẳng trị tổng quát như hình vẽ, anh (chị) hãy chỉ ra sơ đồ thay thế \n\ncủa điện môi rắn hữu cơ cực tính, gồm các nhánh:", "opts": {"A": "Sơ đồ thay thế gồm nhánh 1, 3, 4, 5, 9.", "B": "Sơ đồ thay thế gồm nhánh 1, 2, 3, 9.", "C": "Sơ đồ thay thế gồm nhánh 1, 3, 9.", "D": "Sơ đồ thay thế gồm nhánh 1, 3, 4, 9."}, "ans": "D"}, {"id": 133, "num": 134, "q": "Tìm phương án sai (với  là hằng số điện môi):", "opts": {"A": " là tỷ số giữa điện tích của tụ chứa điện môi bất kỳ với điện tích của tụ có cùng kích \n\nthước cùng điện áp nhưng điện môi là chân không.", "B": " phụ thuộc vào sự thay đổi số phân tử n0 trong 1 đơn vị thể tích điện môi.", "C": " của chất lỏng cực tính càng lớn khi trị số mô men điện của phân tử lưỡng cực càng \n\nlớn và khi số phân tử trong 1 đơn vị thể tích càng nhiều", "D": " của điện môi Xenhit nhỏ và không phụ thuộc vào cường độ điện trường."}, "ans": "D"}, {"id": 134, "num": 135, "q": "(Tìm phương án sai) Xét một điện môi đặt giữa 2 bản cực nối vào một mạch \n\nđiện. Khi đó:", "opts": {"A": "Các điện tích liên kết của điện môi dịch chuyển về phía các điện cực cùng chiều hoặc \n\nngược chiều điện trường tuỳ theo dấu của chúng.", "B": "Các phân tử lưỡng cực (nếu có) sẽ định hướng theo hướng điện trường.", "C": "Mật độ di chuyển của điện tích không phụ thuộc vào giá trị của điện trường.", "D": "Tại bề mặt tiếp giáp của điện môi với điện cực xuất hiện lớp điện tích trái dấu."}, "ans": "C"}, {"id": 135, "num": 136, "q": "(Tìm phương án sai) Khi điện môi được đặt giữa 2 điện cực và nối vào mạch \n\nđiện thì:", "opts": {"A": "Có thể xem như 1 tụ điện và điện tích Q của tụ được xác định: Q = C.U.", "B": "Do quá trình phân cực nên cả khối điện môi sẽ tạo nên 1 mômen điện M = Q.l. với l \nlà bề dầy của khối điện môi.", "C": "Mô men điện trung bình của mỗi phân tử tỷ lệ với điện trường tác động: Mtb = .Eđm  \n\n( được gọi là hệ số phân cực điện môi).", "D": "Trong điện môi xuất hiện điện trường phụ E’ cùng chiều với điện trường ngoài."}, "ans": "D"}, {"id": 136, "num": 137, "q": "Tìm đáp án sai:", "opts": {"A": "Sự phân cực điện tử có ở tất cả các loại điện môi và không liên quan đến tổn thất năng \n\nlượng.", "B": "Phân cực Lưỡng cực chậm xảy ra ở các điện môi có cấu tạo phân tử lưỡng cực, có tổn \n\nthất năng lượng.", "C": "Phân cực ion chậm xảy ra trong các điện môi có cấu tạo ion mà mối liên kết ràng buộc \n\ngiữa các ion không chặt chẽ.", "D": "Phân cực Lưỡng cực chậm xảy ra ở các điện môi có cấu tạo phân tử trung hòa."}, "ans": "D"}, {"id": 137, "num": 138, "q": "Tìm phương án sai (với  là hằng số điện môi):", "opts": {"A": " của chất lỏng trung tính không phụ thuộc tần số nghĩa là nó có thể sử dụng ở bất kỳ \n\ntần số nào.", "B": "Chất lỏng có cực tính mạnh có  cao hơn chất lỏng trung hoà.", "C": " của chất lỏng lưỡng cực thấp hơn  của chất lỏng trung hoà.", "D": " của chất lỏng cực tính phụ thuộc vào nhiệt độ và tần số."}, "ans": "C"}, {"id": 138, "num": 139, "q": "Phát biểu nào dưới đây về điện môi khí trung tính là không chính xác?", "opts": {"A": "Điện môi khí trung tính chỉ tồn tại hiện tượng phân cực điện tử nhanh", "B": "Hằng số điện môi càng nhỏ khi bán kính phân từ càng tăng", "C": "Hằng số điện môi tỷ lệ thuận với áp suất", "D": "Hằng số điện môi tỷ lệ nghịch với nhiệt độ"}, "ans": "B"}, {"id": 139, "num": 140, "q": "Hằng số điện môi của điện môi khí cực tính không phụ thuộc vào yếu tố nào \n\ndưới đây?", "opts": {"A": "Tần số điện trường.", "B": "Bán kính của phân tử.", "C": "Áp suất chất khí.", "D": "Mức độ cực tính."}, "ans": "A"}, {"id": 140, "num": 141, "q": "Phát biểu nào dưới đây về điện môi khí là không chính xác?", "opts": {"A": "Quan hệ của  theo áp suất được đặc trưng bởi biểu thức:\n\n  .", "B": "Sự phân cực lưỡng cực có ý nghĩa chủ yếu.", "C": "Quan hệ của  theo nhiệt độ được đặc trưng bởi biểu thức: \n\n   [độ-1]", "D": "Hằng số điện môi của chất khí  = 2  1."}, "ans": "B"}, {"id": 141, "num": 142, "q": "Phát biểu nào dưới đây về điện môi lỏng trung tính là chính xác?", "opts": {"A": "Hằng số điện môi không phụ thuộc vào bán kính của phân tử.", "B": "Hằng số điện môi chỉ phụ thuộc tần số điện trường.", "C": "Hằng số điện môi không phụ thuộc nhiệt độ của điện môi.", "D": "Hiện tượng phân cực không gây tổn thất năng lượng."}, "ans": "D"}, {"id": 142, "num": 143, "q": "Phát biểu nào dưới đây về phân cực trong chất lỏng cực tính là chính xác?", "opts": {"A": "Phân tử lưỡng cực đóng vai trò thứ yếu trong quá trình phân cực lưỡng cực.", "B": "Ở vùng nhiệt độ thấp, khi nhiệt độ tăng thì hằng số điện môi tăng nhanh.", "C": "Phân cực lưỡng cực chậm không phụ thuộc tần số.", "D": "Độ nhớt của điện môi không ảnh hướng đến hằng số điện môi."}, "ans": "B"}, {"id": 143, "num": 144, "q": "Phát biểu nào dưới đây là Đúng cho điện môi lỏng cực tính?", "opts": {"A": "Khi duy trì tần số của điện áp là không đổi, ở vùng nhiệt độ thấp, ta tăng nhiệt độ \nthì hằng số điện môi của điện môi giảm dần.", "B": "ở vùng tần số cao, khi duy trì nhiệt độ là không đổi, ta tăng tần số thì hằng số điện \n\nmôi không thay đổi.", "C": "Độ nhớt của điện môi không ảnh hướng đến hằng số điện môi của điện môi.", "D": "Chất lỏng có cực tính mạnh có hằng số điện môi rất cao (nước, rượu êtylic...) \nkhông thể dùng làm điện môi do độ dẫn của nó quá lớn. \n\np1dpd1−=dtd1TK=="}, "ans": "D"}, {"id": 144, "num": 145, "q": "Anh (chị) hãy chỉ ra nhận xét nào sau đây với chất khí là không chính xác?", "opts": {"A": "Hằng số điện môi của điện môi khí trung tính chỉ phụ thuộc vào bán kính nguyên tử \n\nmà không phụ thuộc vào nhiệt độ và áp suất.", "B": "Hằng số điện môi của điện môi khí trung tính phụ thuộc vào bán kính nguyên tử, \n\nnhiệt độ và áp suất.", "C": "Trong điện môi khí trung hoà chỉ tồn tại phân cực điện tử nhanh.", "D": "Ở điều kiện bình thường độ ẩm không khí ảnh hưởng không đáng kể đến hằng số \n\nđiện môi"}, "ans": "A"}, {"id": 145, "num": 146, "q": "Anh (chị) hãy chỉ ra nhận xét nào sau đây với chất lỏng là không chính xác?", "opts": {"A": "Điện môi lỏng trung tính chỉ có phân cực điện tử nhanh. Hằng số điện môi gần \n\nbằng bình phương hệ số khúc xạ ánh sáng.", "B": "Hằng số điện môi của điện môi lỏng trung tính phụ thuộc nhiều vào nhiệt độ và tần \n\nsố.", "C": "Điện môi lỏng cực tính có đồng thời phân cực điện tử và phân cực lưỡng cực chậm.", "D": "Hằng số điện môi của điện môi lỏng cực tính lớn hơn của điện môi lỏng trung hòa."}, "ans": "B"}, {"id": 146, "num": 147, "q": "Mối quan hệ  = f(f), khi T là hằng số, của điện môi lỏng trung tính được thể \n\nhiện qua hình vẽ nào dưới đây? \n\n \n\n1 \n\n0 \n\n \n\n \n\n \n\n1 \n0 \n\nf \n\nHình 1 \n\nHình 2 \n\nf \n\n0 \n\nHình 3 \n\nf \n\n0 \n\nf \n\nHình 4", "opts": {"A": "Hình 3.", "B": "Hình 1.", "C": "Hình 2.", "D": "Hình 4"}, "ans": "D"}, {"id": 147, "num": 148, "q": "Cho các nhận xét sau, theo anh (chị) nhận xét nào không chính xác?", "opts": {"A": "Ở điều kiện bình thường, điện dẫn của điện môi lỏng lớn hơn điện dẫn của điện môi \nkhí.", "B": "Ở điều kiện bình thường, điện dẫn của điện môi khí lớn hơn nhiều so với điện dẫn \ncủa điện môi lỏng.", "C": "Ở điều kiện bình thường chất khí được coi là chất cách điện lý tưởng.", "D": "Điện dẫn của điện môi lỏng phụ thuộc nhiều vào nhiệt độ và độ tinh khiết của chất \n\nlỏng."}, "ans": "B"}, {"id": 148, "num": 149, "q": "Trong điện trường xoay chiều điện dẫn của điện môi được xác định theo:", "opts": {"A": "Thành phần tác dụng của dòng điện qua điện môi.", "B": "Độ lớn của dòng điện chuyển dịch qua điện môi.", "C": "Độ lớn của dòng rò đi qua điện môi.", "D": "Độ lớn của dòng điện đi qua tụ điện chứa điện môi đó."}, "ans": "A"}, {"id": 149, "num": 150, "q": "Theo anh (chị) đâu là nguyên nhân dẫn đến dòng điện rò của điện môi?", "opts": {"A": "Khi đặt điện môi trong điện trường sẽ xảy ra hiện tượng phân cực và gây nên dòng \nđiện rò.", "B": "Do quá trình ion hoá gây nên dòng điện rò.", "C": "Do các tạp chất tồn tại trong điện môi, khi đặt trong điện trường chúng chuyển động \nvà gây nên dòng điện rò.", "D": "Trong điện môi kỹ thuật luôn tồn tại một số ít điện tích tự do, khi đặt trong điện trường \n\nchúng gây nên dòng điện rò."}, "ans": "D"}, {"id": 150, "num": 151, "q": "Để đánh giá chất lượng của điện môi, người ta thường dựa vào giá trị của dòng \n\nđiện rò, và điện trở cách điện được xác định bởi công thức:", "opts": {"A": "", "B": "", "C": "", "D": ". \n\n. \n\n. \n\n."}, "ans": "C"}, {"id": 151, "num": 152, "q": "Anh (chị) hãy chỉ ra dạng đúng đặc tính Von-Ampe của điện môi khí? \n\ni \n\ni \n\ni \n\ni \n\n(1)\n\nA \n\nB \n\n(2)\n\nU \n\nU \n\nU\n\nUtdt \n\nU\nHình 2 \n\nHình 1 \n\nU \n\nHình 3 \n\nU \n\nUth \nHình 4", "opts": {"A": "Hình 1. \nHình 2.", "B": "ròpccđIIUIUR−==pcròcđIIUIUR+==pcròcđIIUIUR−==pcròcđIIUIUR+==", "C": "Hình 3.", "D": "Hình 4."}, "ans": "B"}, {"id": 152, "num": 153, "q": "Điện dẫn bề mặt của điện môi rắn phụ thuộc vào các yếu tố cơ bản sau:", "opts": {"A": "Độ ẩm môi trường, tạp chất và tình trạng bề mặt.", "B": "Tính hút ẩm của vật liệu, độ ẩm môi trường, nhiệt độ, tạp chất bám, tình trạng bề \n\nmặt...", "C": "Nhiệt độ, áp suất, độ ẩm không khí và tần số điện trường.", "D": "Nhiệt độ, áp suất, độ ẩm không khí, tần số điện trường, giá trị điện áp."}, "ans": "B"}, {"id": 153, "num": 154, "q": "Tính dẫn điện của điện môi khi ở điều kiện bình thường, dưới tác dụng của \nđiện trường (U < Ugh) là do:", "opts": {"A": "Các điện tích được tạo ra bởi sự ion hóa do va chạm của các phân tử khí chuyển động.", "B": "Các điện tích được tạo ra bởi sự ion hóa phân tử chất khí dưới tác động của các yêu \n\ntố tự nhiên.", "C": "Một số ít các điện tích tự do có sẵn trong chất khí.", "D": "Các điện tích được tạo ra bởi sự ion hóa phân tử khí do va chạm dưới tác động của \n\nđiện trường."}, "ans": "B"}, {"id": 154, "num": 155, "q": "Điện dẫn tự duy trì của điện môi khí xuất hiện khi:", "opts": {"A": "Trong chất khí số có sẵn một ít các điện tích tự do.", "B": "Các yêu tố ion hóa tự nhiên
